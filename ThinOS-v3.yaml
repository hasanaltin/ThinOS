#cloud-config
# Ubuntu 24.04 LTS VDI Thin Client - v3
#
# v3: a deliberate restart, not a continuation of ThinOS.yaml (v1,
# Openbox) or ThinOS-v2.yaml (v2, Openbox -> GNOME Shell + extensions
# added incrementally on top of the whole v1 codebase). Both grew a lot
# of code from approaches that were later abandoned (custom GTK
# taskbar/panel, GTK4/libadwaita, various failed theme attempts) still
# sitting in the file even after the working parts moved on. v3 starts
# with nothing but a base Ubuntu Desktop install and a wallpaper, and
# each further piece (session/shell choice, launchers, admin mode, ...)
# gets added and tested as its own deliberate step - nothing is ported
# over from v1/v2 by default.
#
# Local administrator:
#   username: vdi
#   password: set your own hash below (identity.password) before building.
#             This file is public - never commit a real password hash here.
#             Generate one with:  mkpasswd -m sha-512    (or: openssl passwd -6)

autoinstall:
  version: 1

  interactive-sections:
    - storage

  refresh-installer:
    update: false

  locale: en_US.UTF-8

  keyboard:
    layout: us

  timezone: Europe/Belgrade

  identity:
    realname: VDI Administrator
    hostname: horizon-thinclient
    username: vdi
    # Placeholder only - this is not a usable hash, so the account is locked
    # out until you replace it. Generate your own with `mkpasswd -m sha-512`
    # and paste the result here before building. Never commit a real hash to
    # this public repository.
    password: '$6$YX41O/3bwFChKwsF$ssfHanfJS/OtH39ILYK5HuiOQB2ZWm.bW3FCP.pjXVyUmdx2IGgX8TUv8LMAv1JTqjEah90GVwu96BloO8WsF0'

  source:
    id: ubuntu-desktop-minimal

  drivers:
    install: false

  oem:
    install: false

  codecs:
    install: false

  # Install the base OS from the ISO. Fast/offline base install; late-commands
  # restores normal repositories below before anything network-dependent runs.
  apt:
    preserve_sources_list: false
    geoip: false
    mirror-selection:
      primary:
        - uri: "http://127.0.0.1:9/ubuntu"
          arches:
            - amd64
    fallback: offline-install

  late-commands:
    # Restore normal repositories for the installed system.
    - |
      mkdir -p /target/etc/apt/sources.list.d
      cat > /target/etc/apt/sources.list.d/ubuntu.sources <<'EOF'
      Types: deb
      URIs: https://archive.ubuntu.com/ubuntu
      Suites: noble noble-updates noble-backports
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

      Types: deb
      URIs: https://security.ubuntu.com/ubuntu
      Suites: noble-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      EOF

    # Step 1 (this version): only the wallpaper. Written to the standard
    # shared backgrounds location and set as a dconf system-wide default -
    # applies to any user's session automatically, with no custom firstboot
    # service/session script needed for just this.
    - |
      mkdir -p /target/usr/share/backgrounds
      base64 -d > /target/usr/share/backgrounds/thinos-wallpaper.jpg <<'THINOS_WALLPAPER_JPG'
