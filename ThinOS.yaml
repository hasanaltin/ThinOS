          def position_panel(self):
              display = Gdk.Display.get_default()
              monitor = (
                  display.get_primary_monitor()
                  if display
                  else None
              )

              if (
                  monitor is None
                  and display is not None
                  and display.get_n_monitors() > 0
              ):
                  monitor = display.get_monitor(0)

              if monitor is not None:
                  geometry = monitor.get_geometry()

                  self.panel.move(
                      geometry.x,
                      geometry.y
                      + geometry.height
                      - PANEL_HEIGHT
                  )

                  self.panel.set_size_request(
                      geometry.width,
                      PANEL_HEIGHT
                  )

              else:
                  screen = Gdk.Screen.get_default()

                  self.panel.move(
                      0,
                      screen.get_height()
                      - PANEL_HEIGHT
                  )

                  self.panel.set_size_request(
                      screen.get_width(),
                      PANEL_HEIGHT
                  )

          def setup_tasklist(self):
              Wnck.set_client_type(Wnck.ClientType.PAGER)

              self.wnck_screen = Wnck.Screen.get_default()
              self.wnck_screen.connect("window-opened", self.on_window_opened)
              self.wnck_screen.connect("window-closed", self.on_window_closed)

              self.wnck_screen.connect(
                  "active-window-changed",
                  self.on_active_window_changed
              )

              self.wnck_screen.force_update()

              for window in self.wnck_screen.get_windows():
                  self.add_task_button(window)

          def on_window_opened(self, _screen, window):
              self.add_task_button(window)

          def on_window_closed(self, _screen, window):
              button = self.task_buttons.pop(window, None)
              if button is not None:
                  button.destroy()

          def on_active_window_changed(self, screen, _previous_window):
              active = screen.get_active_window()

              for window, button in self.task_buttons.items():
                  button.set_active(window == active)

          def add_task_button(self, window):
              if window.is_skip_tasklist() or window in self.task_buttons:
                  return

              button = Gtk.ToggleButton()
              button.set_name("TaskButton")
              button.set_relief(Gtk.ReliefStyle.NONE)

              box = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=6
              )

              icon = Gtk.Image()
              pixbuf = window.get_icon()
              if pixbuf is not None:
                  icon.set_from_pixbuf(pixbuf)

              label = Gtk.Label(label=window.get_name())
              label.set_max_width_chars(22)
              label.set_ellipsize(Pango.EllipsizeMode.END)
              label.set_xalign(0)

              box.pack_start(icon, False, False, 0)
              box.pack_start(label, True, True, 0)
              button.add(box)

              button.set_active(window.is_active())

              button.connect(
                  "clicked",
                  self.on_task_clicked,
                  window
              )

              window.connect(
                  "name-changed",
                  lambda w: label.set_text(w.get_name())
              )

              self.tasks.pack_start(button, False, False, 0)
              button.show_all()

              self.task_buttons[window] = button

          def on_task_clicked(self, _button, window):
              timestamp = Gtk.get_current_event_time()

              if window.is_minimized():
                  window.unminimize(timestamp)
                  window.activate(timestamp)
              elif window.is_active():
                  window.minimize()
              else:
                  window.activate(timestamp)

