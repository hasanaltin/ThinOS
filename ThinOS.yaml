      cat > /usr/local/bin/thinclient-exit-admin <<'EOF'
      #!/bin/bash
      set -u

      RUNTIME="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
      MARKER="$RUNTIME/thinclient-admin-mode"

      # Close by WM_CLASS rather than tracking a PID: gnome-terminal is a
      # client/server app, so the process that launches a window is not
      # reliably the process behind that window for the whole time it is
      # open, which made PID-based tracking fragile. WM_CLASS survives
      # things a window title does not (e.g. the shell inside setting its
      # own title), and only this specific admin terminal window uses this
      # class - the "Check for Updates" terminal is unaffected.
      wmctrl -x -c thinclient-admin-terminal 2>/dev/null || true

      rm -f "$MARKER"
      EOF
      chmod 755 /usr/local/bin/thinclient-exit-admin

      cat > /usr/local/bin/thinclient-admin-terminal <<'EOF'
      #!/bin/bash
      set -euo pipefail

      RUNTIME="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
      MARKER="$RUNTIME/thinclient-admin-mode"

      [ -f "$MARKER" ] || exit 1

      # A real terminal emulator with its own close button (CSD), unlike
      # xterm, which has none and depends entirely on the window manager to
      # supply one - reported as impossible to close.
      exec /usr/bin/gnome-terminal \
          --class=thinclient-admin-terminal \
          --title "Administrator Terminal" \
          -- /bin/bash -lc 'exec sudo -n /usr/local/sbin/thinclient-admin-tool terminal'
      EOF
      chmod 755 /usr/local/bin/thinclient-admin-terminal

      # One-click updater: refreshes Ubuntu packages, then pulls the latest
      # ThinOS.yaml from GitHub and re-runs its provisioning script (the same
      # one that runs on first boot) so appliance files stay in sync with the
      # repository. Runs as root via thinclient-admin-tool.
      cat > /usr/local/sbin/thinclient-update <<'EOF'
      #!/bin/bash
      set -uo pipefail

      REPO="hasanaltin/ThinOS"
      VERSION_FILE="/var/lib/thinclient/thinos-version"
      LOG="/var/log/thinclient-update.log"

      mkdir -p /var/lib/thinclient
      exec > >(tee -a "$LOG") 2>&1
      echo
      echo "=== ThinOS Update: $(date -Is) ==="

      # Tracks overall success independently of the final interactive prompt
      # below, so callers (including the GUI, which runs with stdin closed)
      # can rely on this script's exit code to know whether the update worked.
      STATUS=0

      echo
      echo "--- Ubuntu system updates ---"
      if apt-get update; then
          apt-get -y full-upgrade
          apt-get -y autoremove --purge
      else
          echo "Failed to refresh the package index; skipping system upgrade." >&2
          STATUS=1
      fi

      echo
      echo "--- ThinOS appliance updates ---"
      WORKDIR=$(mktemp -d)
      trap 'rm -rf "$WORKDIR"' EXIT

      # Prefer resolving the latest commit SHA via the API and fetching the
      # raw file by that exact SHA: raw.githubusercontent.com caches
      # branch-name URLs at its CDN edge and can keep serving an older
      # commit's content for a while after a push (observed in practice), but
      # a URL pinned to an immutable commit SHA does not have that problem.
      #
      # api.github.com enforces a 60-requests-per-hour limit for
      # unauthenticated callers, shared across everything behind the same
      # public IP - easy to exhaust with only a handful of devices (observed
      # in practice too: it started returning 403 and silently failed here).
      # raw.githubusercontent.com is a plain content fetch, not subject to
      # that quota, so if the API call fails for any reason, fall back to it
      # by branch name - accepting the small chance of briefly-stale content
      # is far better than the update silently doing nothing.
      REMOTE_SHA=$(
          curl -fsSL --connect-timeout 15 --max-time 30 \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/commits/master" 2>/dev/null \
          | python3 -c 'import json,sys
      try:
          print(json.load(sys.stdin).get("sha",""))
      except Exception:
          pass' 2>/dev/null \
          || true
      )

      DOWNLOADED=0

      if [ -n "$REMOTE_SHA" ] && curl -fsSL --connect-timeout 15 --max-time 60 \
              -o "$WORKDIR/ThinOS.yaml" \
              "https://raw.githubusercontent.com/$REPO/$REMOTE_SHA/ThinOS.yaml"; then
          DOWNLOADED=1
      else
          echo "Could not resolve an exact commit via the GitHub API (it may be rate-limited); falling back to the master branch URL." >&2

          if curl -fsSL --connect-timeout 15 --max-time 60 \
                  -o "$WORKDIR/ThinOS.yaml" \
                  "https://raw.githubusercontent.com/$REPO/master/ThinOS.yaml"; then
              DOWNLOADED=1
          fi
      fi

      if [ "$DOWNLOADED" -ne 1 ]; then
          echo "Could not download ThinOS.yaml from GitHub by any method; skipping ThinOS update." >&2
          STATUS=1
      else
          REMOTE_KEY=$(sha256sum "$WORKDIR/ThinOS.yaml" | awk '{print $1}')
          LOCAL_KEY=$(cat "$VERSION_FILE" 2>/dev/null || true)

          if [ "$REMOTE_KEY" = "$LOCAL_KEY" ]; then
              echo "ThinOS appliance is already up to date ($REMOTE_KEY)."
          else
              echo "Newer ThinOS configuration found ($REMOTE_KEY). Applying..."

              awk '
                  /^[[:space:]]*cat > \/target\/usr\/local\/sbin\/thinclient-firstboot <<.THINCLIENT_FIRSTBOOT.[[:space:]]*$/ { flag=1; next }
                  flag && /^[[:space:]]*THINCLIENT_FIRSTBOOT[[:space:]]*$/ { flag=0 }
                  flag { print }
              ' "$WORKDIR/ThinOS.yaml" | sed -e 's/^      //' > "$WORKDIR/provision.sh"

              if [ ! -s "$WORKDIR/provision.sh" ]; then
                  echo "Could not find the provisioning script inside the downloaded ThinOS.yaml." >&2
                  STATUS=1
              else
                  # Re-run the same script first boot uses, minus the two
                  # steps that only make sense on a brand-new install: the
                  # "already configured" early-exit, and the unconditional
                  # reboot at the very end.
                  sed -i \
                      -e '/^if \[ -e "\$MARKER" \]; then$/,/^fi$/d' \
                      -e '/^systemctl --no-block reboot/d' \
                      "$WORKDIR/provision.sh"
                  chmod 755 "$WORKDIR/provision.sh"

                  if bash "$WORKDIR/provision.sh"; then
                      echo "$REMOTE_KEY" > "$VERSION_FILE"
                      echo "ThinOS appliance files updated."
                      echo "Restarting the desktop panel to apply changes..."
                      # Kill the actual running GUI process, not the
                      # thinclient-panel wrapper: killing only the wrapper
                      # wouldn't take its child down with it, and the
                      # watchdog would never notice anything was wrong.
                      pkill -u kiosk -f /usr/local/bin/thinclient-shell 2>/dev/null || true
                  else
                      echo "ThinOS update failed; see $LOG for details." >&2
                      STATUS=1
                  fi
              fi
          fi
      fi

      echo
      echo "=== Update check complete ==="
      echo
      read -rp "Press Enter to close..." || true
      exit "$STATUS"
      EOF
      chmod 755 /usr/local/sbin/thinclient-update

      cat > /usr/local/sbin/thinclient-admin-tool <<'EOF'
      #!/bin/bash
      set -euo pipefail

      KUID=$(id -u kiosk)
      MARKER="/run/user/$KUID/thinclient-admin-mode"

      if [ "${SUDO_USER:-}" != "kiosk" ]; then
          echo "This command is available only from the thin-client session."
          exit 1
      fi

      if [ ! -f "$MARKER" ]; then
          echo "Administrator Mode is not enabled."
          exit 1
      fi

      if [ "$(stat -c %U "$MARKER" 2>/dev/null)" != "kiosk" ]; then
          echo "Invalid Administrator Mode state."
          exit 1
      fi

      case "${1:-}" in
          terminal)
              exec /usr/sbin/runuser --login vdi
              ;;

          netstats)
              clear
              echo "Network Statistics"
              echo "=================="
              echo
              ip -br address
              echo
              echo "Routes"
              echo "------"
              ip route
              echo
              echo "Interface Statistics"
              echo "--------------------"
              ip -s link
              echo
              echo "Socket Summary"
              echo "--------------"
              ss -s
              echo
              read -rp "Press Enter to close..."
              ;;

          updates)
              exec /usr/local/sbin/thinclient-update
              ;;

          editor)
              exec /usr/sbin/runuser -u vdi -- nano
              ;;

          taskmgr)
              exec top
              ;;

          logs)
              journalctl -b -n 250 --no-pager
              echo
              read -rp "Press Enter to close..."
              ;;

          *)
              echo "Unsupported administrator tool."
              exit 2
              ;;
      esac
      EOF
      chmod 755 /usr/local/sbin/thinclient-admin-tool

      cat > /etc/sudoers.d/thinclient-admin-auth <<'EOF'
      kiosk ALL=(root) NOPASSWD: /usr/bin/pamtester login vdi authenticate

      Cmnd_Alias THINCLIENT_ADMIN_TOOLS = \
      /usr/local/sbin/thinclient-admin-tool terminal, \
      /usr/local/sbin/thinclient-admin-tool netstats, \
      /usr/local/sbin/thinclient-admin-tool updates, \
      /usr/local/sbin/thinclient-admin-tool editor, \
      /usr/local/sbin/thinclient-admin-tool taskmgr, \
      /usr/local/sbin/thinclient-admin-tool logs

      kiosk ALL=(root) NOPASSWD: THINCLIENT_ADMIN_TOOLS
      EOF
      chmod 440 /etc/sudoers.d/thinclient-admin-auth
      visudo -cf /etc/sudoers.d/thinclient-admin-auth

      cat > /usr/local/bin/thinclient-power <<'PY'
      #!/usr/bin/python3
      import gi
      import subprocess
      import sys

      gi.require_version("Gtk", "3.0")
      from gi.repository import Gtk

      if len(sys.argv) != 2 or sys.argv[1] not in ("reboot", "poweroff"):
          raise SystemExit(1)

      action = sys.argv[1]
      verb = "restart" if action == "reboot" else "shut down"

      dialog = Gtk.MessageDialog(
          modal=True,
          message_type=Gtk.MessageType.QUESTION,
          buttons=Gtk.ButtonsType.YES_NO,
          text=f"Are you sure you want to {verb} this thin client?"
      )

      response = dialog.run()
      dialog.destroy()

      if response == Gtk.ResponseType.YES:
          subprocess.Popen(["systemctl", action])
      PY
      chmod 755 /usr/local/bin/thinclient-power

      # Custom appliance shell. The Start menu intentionally has no Search bar.
      cat > /usr/local/bin/thinclient-shell <<'PY'
      #!/usr/bin/python3

      import gi
      import os
      import re
      import shlex
      import subprocess
      import threading
      from datetime import datetime

      gi.require_version("Gtk", "3.0")
      gi.require_version("Gdk", "3.0")
      gi.require_version("Wnck", "3.0")
      from gi.repository import Gtk, Gdk, GLib, Pango, Wnck


      PANEL_HEIGHT = 52
      MENU_WIDTH = 350

      ADMIN_MARKERS = [
          os.path.expanduser("~/.cache/thinclient/admin-mode"),
          f"/run/user/{os.getuid()}/thinclient-admin-mode",
      ]


      def command(args):
          try:
              return subprocess.check_output(
                  args,
                  text=True,
                  stderr=subprocess.DEVNULL
              ).strip()
          except Exception:
              return ""


      def spawn(command_line):
          try:
              subprocess.Popen(
                  shlex.split(command_line),
                  start_new_session=True
              )
          except Exception:
              pass


      def admin_enabled():
          return any(os.path.exists(path) for path in ADMIN_MARKERS)


      def nmcli_split(line):
          # nmcli -t escapes literal ":" inside a field as "\:"; split only on
          # unescaped colons so an SSID containing ":" isn't cut in half.
          parts = re.split(r"(?<!\\):", line)
          return [p.replace("\\:", ":") for p in parts]


      def wifi_device():
          out = command(["nmcli", "-t", "-f", "DEVICE,TYPE", "device"])

          for line in out.splitlines():
              fields = nmcli_split(line)
              if len(fields) == 2 and fields[1] == "wifi":
                  return fields[0]

          return ""


      def wifi_scan():
          device = wifi_device()
          if not device:
              return None

          subprocess.run(
              ["nmcli", "device", "wifi", "rescan", "ifname", device],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              timeout=15
          )

          out = command([
              "nmcli", "-t", "-f", "IN-USE,SSID,SIGNAL,SECURITY",
              "device", "wifi", "list", "ifname", device
          ])

          seen = set()
          networks = []

          for line in out.splitlines():
              fields = nmcli_split(line)
              if len(fields) < 4:
                  continue

              in_use, ssid, signal = fields[0], fields[1], fields[2]
              security = ":".join(fields[3:])

              if not ssid or ssid in seen:
                  continue
              seen.add(ssid)

              networks.append({
                  "ssid": ssid,
                  "signal": int(signal) if signal.isdigit() else 0,
                  "secured": bool(security.strip()) and security.strip() != "--",
                  "in_use": in_use == "*",
              })

          networks.sort(key=lambda n: (-n["in_use"], -n["signal"]))
          return networks


      def wifi_connect(ssid, password):
          args = ["nmcli", "device", "wifi", "connect", ssid]
          if password:
              args += ["password", password]

          try:
              result = subprocess.run(
                  args, capture_output=True, text=True, timeout=45
              )
              return result.returncode == 0, result.stderr.strip()
          except Exception as exc:
              return False, str(exc)


      class VDIShell:

          def __init__(self):
              self.start_menu = None
              self.tools_submenu = None
              self.power_submenu = None
              self.task_buttons = {}
              self.start_menu_closed_at = 0

              self.apply_css()
              self.create_panel()
              self.create_start_menu()
              self.setup_tasklist()

              GLib.timeout_add_seconds(
                  1,
                  self.update_clock
              )

              self.update_clock()

          def apply_css(self):
              css = b"""
