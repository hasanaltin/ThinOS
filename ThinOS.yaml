      #!/usr/bin/python3
      import gi
      import os
      import platform
      import subprocess

      gi.require_version("Gtk", "4.0")
      gi.require_version("Adw", "1")

      from gi.repository import Gtk, Adw


      def command(args):
          try:
              return subprocess.check_output(
                  args,
                  text=True,
                  stderr=subprocess.DEVNULL
              ).strip()
          except Exception:
              return ""


      def os_name():
          try:
              values = {}
              with open("/etc/os-release", encoding="utf-8") as f:
                  for line in f:
                      if "=" in line:
                          k, v = line.rstrip().split("=", 1)
                          values[k] = v.strip('"')
              return values.get("PRETTY_NAME", "Ubuntu")
          except Exception:
              return "Ubuntu"


      def cpu_name():
          for line in command(["lscpu"]).splitlines():
              if line.startswith("Model name:"):
                  return line.split(":", 1)[1].strip()
          return platform.processor() or "Unknown"


      def memory_total():
          try:
              with open("/proc/meminfo", encoding="utf-8") as f:
                  for line in f:
                      if line.startswith("MemTotal:"):
                          kb = int(line.split()[1])
                          return f"{kb / 1024 / 1024:.1f} GiB"
          except Exception:
              pass
          return "Unknown"


      def network_information():
          interface = ""
          gateway = ""

          route = command(["ip", "route", "show", "default"])

          if route:
              parts = route.split()
              if "dev" in parts:
                  interface = parts[parts.index("dev") + 1]
              if "via" in parts:
                  gateway = parts[parts.index("via") + 1]

          ipv4 = ""
          mac = ""

          if interface:
              address = command(
                  ["ip", "-4", "-o", "addr", "show", "dev", interface]
              )

              if address:
                  fields = address.split()
                  if "inet" in fields:
                      ipv4 = fields[fields.index("inet") + 1].split("/")[0]

              try:
                  with open(
                      f"/sys/class/net/{interface}/address",
                      encoding="utf-8"
                  ) as f:
                      mac = f.read().strip()
              except Exception:
                  pass

          return interface, ipv4, gateway, mac


      def uptime():
          try:
              with open("/proc/uptime", encoding="utf-8") as f:
                  seconds = int(float(f.read().split()[0]))
              days, seconds = divmod(seconds, 86400)
              hours, seconds = divmod(seconds, 3600)
              minutes = seconds // 60

              parts = []
              if days:
                  parts.append(f"{days}d")
              if hours:
                  parts.append(f"{hours}h")
              parts.append(f"{minutes}m")
              return " ".join(parts)

          except Exception:
              return "Unknown"


      def add_row(group, title, value, icon):
          row = Adw.ActionRow(
              title=title,
              subtitle=value or "Not available"
          )

          image = Gtk.Image.new_from_icon_name(icon)
          image.set_pixel_size(22)
          row.add_prefix(image)
          group.add(row)


