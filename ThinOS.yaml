#cloud-config
# Ubuntu 24.04 LTS VDI Thin Client - current enterprise shell build
#
# Local administrator:
#   username: vdi
#   password: set your own hash below (identity.password) before building.
#             This file is public - never commit a real password hash here.
#             Generate one with:  mkpasswd -m sha-512    (or: openssl passwd -6)
#
# End-user session:
#   LightDM -> hidden kiosk autologin -> Openbox + Nemo thin-client desktop
#
# Desktop empty-space right-click (Ubuntu 24.04 / Nemo 6.0.2):
#   Create > Citrix / RDP / Omnissa Horizon
#   Arrange > By Name / By Type / By Size / By Modification Date
#   Implemented by nemo-python (not actions-tree.json, which is not used here).
#
# Saved RDP shortcut right-click:
#   Start / Edit / Copy / Rename / Delete
#
# Note: Omnissa Horizon is downloaded from the URL used in the previous image.
# Citrix Workspace is not bundled because no Citrix package URL was supplied.
# UI: custom VDI shell, libadwaita System Information / Control Center /
# Administrator Login, single Openbox workspace, no Start-menu Search bar, graphical Administrator Tools,
# and a built-in enterprise-style wallpaper.

autoinstall:
  version: 1

  interactive-sections:
    - storage

  refresh-installer:
    update: false

  locale: en_US.UTF-8

  keyboard:
    layout: us

  timezone: Europe/Belgrade

  identity:
    realname: VDI Administrator
    hostname: horizon-thinclient
    username: vdi
    # Placeholder only - this is not a usable hash, so the account is locked
    # out until you replace it. Generate your own with `mkpasswd -m sha-512`
    # and paste the result here before building. Never commit a real hash to
    # this public repository.
    password: 'CHANGEME-generate-your-own-sha512-crypt-hash'

  source:
    id: ubuntu-desktop-minimal

  drivers:
    install: false

  oem:
    install: false

  codecs:
    install: false

  # Install the base OS from the ISO. The thin-client desktop packages are
  # installed by the first-boot service after networking is available.
  apt:
    preserve_sources_list: false
    geoip: false
    mirror-selection:
      primary:
        - uri: "http://127.0.0.1:9/ubuntu"
          arches:
            - amd64
    fallback: offline-install

  late-commands:
    # Restore normal repositories for the installed system.
    - |
      mkdir -p /target/etc/apt/sources.list.d
      cat > /target/etc/apt/sources.list.d/ubuntu.sources <<'EOF'
      Types: deb
      URIs: https://archive.ubuntu.com/ubuntu
      Suites: noble noble-updates noble-backports
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

      Types: deb
      URIs: https://security.ubuntu.com/ubuntu
      Suites: noble-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      EOF

    - |
      mkdir -p /target/etc/apt/apt.conf.d
      cat > /target/etc/apt/apt.conf.d/99-thinclient-network <<'EOF'
      Acquire::ForceIPv4 "true";
      Acquire::Retries "5";
      Acquire::http::Timeout "30";
      Acquire::https::Timeout "30";
      EOF


    # Install the full thin-client provisioning script into the target.
    - |
      cat > /target/usr/local/sbin/thinclient-firstboot <<'THINCLIENT_FIRSTBOOT'
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      
      MARKER=/var/lib/thinclient/configured
      if [ -e "$MARKER" ]; then
          exit 0
      fi
      
      mkdir -p /var/lib/thinclient
      
      # Keep a persistent provisioning log. If provisioning fails, the stock
      # Ubuntu graphical login remains available for administrator recovery.
      exec > >(tee -a /var/log/thinclient-firstboot.log) 2>&1
      FAILED=/var/lib/thinclient/last-error
      trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "Thin Client provisioning failed at line %s (exit %s).\nSee /var/log/thinclient-firstboot.log\n" "$LINENO" "$rc" > "$FAILED"; fi' EXIT
      rm -f "$FAILED"

      # Wait up to three minutes for DNS/networking. Do not loop forever: a
      # failed first boot must fall back to the normal Ubuntu graphical login.
      NETWORK_READY=0
      for _ in $(seq 1 36); do
          if getent hosts archive.ubuntu.com >/dev/null 2>&1; then
              NETWORK_READY=1
              break
          fi
          sleep 5
      done
      if [ "$NETWORK_READY" -ne 1 ]; then
          echo 'Network/DNS did not become ready; leaving Ubuntu recovery desktop enabled.' >&2
          exit 20
      fi

      apt-get update
      apt-get install -y --no-install-recommends \
          lightdm slick-greeter \
          xserver-xorg xserver-xorg-core xserver-xorg-input-libinput \
          openbox picom \
          nemo nemo-python \
          cinnamon-desktop-data librsvg2-common \
          python3 python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-wnck-3.0 \
          freerdp3-x11 \
          network-manager network-manager-gnome \
          pavucontrol arandr lxinput pulseaudio-utils \
          lxpolkit \
          zenity pamtester xterm wmctrl \
          gnome-terminal gnome-text-editor gnome-system-monitor gnome-logs gnome-screenshot update-manager \
          x11-xserver-utils x11-utils xinput dbus-x11 dconf-cli \
          xdg-user-dirs curl ca-certificates openssh-server

      # Installing LightDM must not take away the working Ubuntu recovery GUI
      # until every appliance component has passed validation.
      if [ -f /lib/systemd/system/gdm3.service ]; then
          ln -sf /lib/systemd/system/gdm3.service /etc/systemd/system/display-manager.service
          systemctl enable gdm3.service 2>/dev/null || true
      fi

      # Local administrator already exists from autoinstall identity. Ensure
      # the hidden kiosk account exists for the appliance session.
      if ! id kiosk >/dev/null 2>&1; then
          useradd -m -s /bin/bash kiosk
      fi
      passwd -l kiosk || true
      mkdir -p \
          /home/kiosk/Desktop \
          /home/kiosk/.config/nemo \
          /home/kiosk/.config/thinclient \
          /home/kiosk/.cache/thinclient \
          /home/kiosk/.local/share/nemo/actions \
          /home/kiosk/.local/share/nemo-python/extensions

      runuser -u kiosk -- xdg-user-dirs-update --set DESKTOP /home/kiosk/Desktop 2>/dev/null || true

      # Enterprise-style wallpaper shipped with the appliance. It is a simple
      # original SVG so the installation has no external wallpaper dependency.
      mkdir -p /usr/local/share/thinclient
      cat > /usr/local/share/thinclient/wallpaper.svg <<'EOF'
      <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#14364d"/>
            <stop offset="0.55" stop-color="#1f5b7a"/>
            <stop offset="1" stop-color="#2f7fa3"/>
          </linearGradient>
          <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2f6f8f" stop-opacity="0.78"/>
            <stop offset="1" stop-color="#4f9bb7" stop-opacity="0.58"/>
          </linearGradient>
          <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#17435f" stop-opacity="0.72"/>
            <stop offset="1" stop-color="#2a6685" stop-opacity="0.58"/>
          </linearGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#bg)"/>
        <path d="M0 210 C330 80 540 360 860 260 C1160 165 1430 15 1920 95 L1920 0 L0 0 Z" fill="#0f2f43" opacity="0.33"/>
        <path d="M0 590 C310 520 520 760 790 645 C1085 520 1390 540 1920 300 L1920 720 C1510 840 1210 760 915 865 C590 980 315 805 0 915 Z" fill="url(#wave2)"/>
        <path d="M0 805 C310 680 500 955 820 865 C1160 770 1460 650 1920 565 L1920 1080 L0 1080 Z" fill="url(#wave1)"/>
      </svg>
      EOF
      chmod 644 /usr/local/share/thinclient/wallpaper.svg

      # Thin-client users get exactly one Openbox workspace. This prevents
      # workspace-switch popups such as "desktop 2" from ever appearing.
      mkdir -p /home/kiosk/.config/openbox
      cp /etc/xdg/openbox/rc.xml /home/kiosk/.config/openbox/rc.xml
      python3 - <<'PY'
      import re
      import xml.etree.ElementTree as ET

      path = "/home/kiosk/.config/openbox/rc.xml"
      tree = ET.parse(path)
      root = tree.getroot()

      m = re.match(r"\{(.+)\}", root.tag)
      if m:
          ET.register_namespace("", m.group(1))

      def local(tag):
          return tag.rsplit("}", 1)[-1]

      found = False
      for elem in root.iter():
          if local(elem.tag) == "desktops":
              for child in elem:
                  if local(child.tag) == "number":
                      child.text = "1"
                      found = True
                  elif local(child.tag) == "firstdesk":
                      child.text = "1"

      if not found:
          raise SystemExit("Could not find Openbox desktop count")

      tree.write(path, encoding="UTF-8", xml_declaration=True)
      PY
      chown -R kiosk:kiosk /home/kiosk/.config/openbox

      # Hide kiosk from user choosers while retaining manual administrator
      # login as a recovery path if the kiosk session ever exits.
      mkdir -p /var/lib/AccountsService/users
      cat > /var/lib/AccountsService/users/kiosk <<'EOF'
      [User]
      SystemAccount=true
      XSession=thinclient-openbox
      EOF
      chmod 600 /var/lib/AccountsService/users/kiosk

      # Dedicated X11 appliance session. Openbox has no compositor, which
      # deliberately removes a large source of GPU-specific black-screen bugs.
      cat > /usr/share/xsessions/thinclient-openbox.desktop <<'EOF'
      [Desktop Entry]
      Name=Thin Client
      Comment=Thin Client Openbox session
      Exec=/usr/local/bin/thinclient-session
      TryExec=/usr/local/bin/thinclient-session
      Type=Application
      DesktopNames=ThinClient;
      EOF

      # LightDM configuration is prepared now but does not become the default
      # display manager until final validation succeeds.
      mkdir -p /etc/lightdm/lightdm.conf.d
      cat > /etc/lightdm/lightdm.conf.d/99-thinclient.conf <<'EOF'
      [Seat:*]
      greeter-session=slick-greeter
      user-session=thinclient-openbox
      autologin-user=kiosk
      autologin-user-timeout=0
      allow-guest=false
      greeter-hide-users=true
      greeter-show-manual-login=true
      EOF
      cat > /home/kiosk/.dmrc <<'EOF'
      [Desktop]
      Session=thinclient-openbox
      EOF

      # Session-wide Nemo resource overlay.
      sed -i '/^G_RESOURCE_OVERLAYS=/d' /etc/environment 2>/dev/null || true
      echo 'G_RESOURCE_OVERLAYS=/org/nemo=/usr/local/share/thinclient/nemo-overlay' >> /etc/environment

      # Nemo defaults. The resource overlay below supplies the intentionally
      # restricted background and selected-RDP context menus.
      mkdir -p /etc/dconf/profile /etc/dconf/db/local.d
      cat > /etc/dconf/profile/user <<'EOF'
      user-db:user
      system-db:local
      EOF
      cat > /etc/dconf/db/local.d/00-thinclient <<'EOF'
      [org/nemo/plugins]
      disabled-actions=['90_new-launcher.nemo_action','add-desklets.nemo_action','set-resolution.nemo_action','change-background.nemo_action']

      [org/nemo/preferences]
      enable-delete=false

      [org/nemo/preferences/menu-config]
      desktop-menu-customize=false
      EOF
      dconf update || true

      # Openbox/Nemo appliance session. The watchdog restarts only the desktop
      # and panel helpers; Openbox remains the stable window manager.
      cat > /usr/local/bin/thinclient-session <<'EOF'
      #!/bin/bash
      set -u
      export XDG_CURRENT_DESKTOP=ThinClient
      export DESKTOP_SESSION=thinclient-openbox
      export XDG_SESSION_DESKTOP=thinclient-openbox

      # Fix a fixed 1x scale everywhere instead of letting GTK3, GTK4, and X11
      # apps each auto-detect DPI independently. Without this, different
      # toolkit versions can disagree on the scale factor, which is what was
      # causing inconsistent window scaling and clipped panel text.
      export GDK_SCALE=1
      export GDK_DPI_SCALE=1
      export QT_AUTO_SCREEN_SCALE_FACTOR=0
      export QT_SCALE_FACTOR=1

      xset s off >/dev/null 2>&1 || true
      xset -dpms >/dev/null 2>&1 || true
      xset s noblank >/dev/null 2>&1 || true
      setxkbmap us >/dev/null 2>&1 || true
      xsetroot -solid '#14364d' >/dev/null 2>&1 || true
      echo 'Xft.dpi: 96' | xrdb -merge - >/dev/null 2>&1 || true
      dbus-update-activation-environment --systemd DISPLAY XAUTHORITY XDG_CURRENT_DESKTOP DESKTOP_SESSION 2>/dev/null || true

      # Nemo reads its wallpaper from the Cinnamon desktop-background schema.
      # Keep a matching root color as a fallback during desktop startup.
      if gsettings list-schemas | grep -qx 'org.cinnamon.desktop.background'; then
          gsettings set org.cinnamon.desktop.background picture-uri 'file:///usr/local/share/thinclient/wallpaper.svg' || true
          gsettings set org.cinnamon.desktop.background picture-options 'zoom' || true
          gsettings set org.cinnamon.desktop.background primary-color '#14364d' || true
          gsettings set org.cinnamon.desktop.background secondary-color '#2f7fa3' || true
      fi

      /usr/bin/lxpolkit >/dev/null 2>&1 &
      /usr/bin/openbox &
      OBPID=$!

      # Lightweight compositor, xrender backend only (no shadows, fading, or
      # blur - and no GLX, which is far more likely to black-screen on
      # virtual/embedded GPUs). This gives GTK4/libadwaita windows proper
      # double buffering, which is what the unredirected, compositor-less
      # setup was causing them to redraw without.
      /usr/bin/picom --backend xrender --no-vsync >/tmp/thinclient-picom.log 2>&1 &

      sleep 1
      /usr/bin/nemo-desktop >/tmp/thinclient-nemo.log 2>&1 &
      /usr/local/bin/thinclient-panel >/tmp/thinclient-panel.log 2>&1 &

      (
          while kill -0 "$OBPID" 2>/dev/null; do
              pgrep -u "$(id -u)" -f '/usr/bin/nemo-desktop' >/dev/null 2>&1 || /usr/bin/nemo-desktop >/tmp/thinclient-nemo.log 2>&1 &
              pgrep -u "$(id -u)" -f '/usr/local/bin/thinclient-panel' >/dev/null 2>&1 || /usr/local/bin/thinclient-panel >/tmp/thinclient-panel.log 2>&1 &
              pgrep -u "$(id -u)" -f '/usr/bin/picom' >/dev/null 2>&1 || /usr/bin/picom --backend xrender --no-vsync >/tmp/thinclient-picom.log 2>&1 &
              sleep 5
          done
      ) &

      wait "$OBPID"
      EOF
      chmod 755 /usr/local/bin/thinclient-session

      # Arrange helper used by desktop right-click menu.
      cat > /usr/local/bin/thinclient-arrange <<'EOF'
      #!/bin/bash
      set -e
      case "${1:-}" in
          name|size|type|mtime) ;;
          *) exit 1 ;;
      esac
      DESKTOP="${XDG_DESKTOP_DIR:-$HOME/Desktop}"
      gio set -t string "$DESKTOP" metadata::nemo-icon-view-auto-layout true 2>/dev/null || true
      gio set -t string "$DESKTOP" metadata::nemo-icon-view-sort-by "$1" 2>/dev/null || true
      EOF
      chmod 755 /usr/local/bin/thinclient-arrange
      
      # Generic client launchers.
      cat > /usr/local/bin/thinclient-horizon <<'EOF'
      #!/bin/bash
      if [ -x /usr/bin/horizon-client ]; then
          exec /usr/bin/horizon-client
      fi
      exec zenity --error --title='Omnissa Horizon' --text='Omnissa Horizon Client is not installed.'
      EOF
      chmod 755 /usr/local/bin/thinclient-horizon
      
      cat > /usr/local/bin/thinclient-citrix <<'EOF'
      #!/bin/bash
      if [ -x /opt/Citrix/ICAClient/selfservice ]; then
          exec /opt/Citrix/ICAClient/selfservice
      elif [ -x /opt/Citrix/ICAClient/wfica ]; then
          exec /opt/Citrix/ICAClient/wfica
      fi
      exec zenity --error --title='Citrix' --text='Citrix Workspace is not installed. Add the Citrix package to this image or install it later.'
      EOF
      chmod 755 /usr/local/bin/thinclient-citrix
      
      # RDP GUI: normal connect, --create desktop shortcut, or --edit saved profile.
      cat > /usr/local/bin/thinclient-rdp <<'PY'
      #!/usr/bin/python3
      import gi
      import json
      import os
      import re
      import subprocess
      import sys
      
      gi.require_version("Gtk", "3.0")
      from gi.repository import Gtk
      
      CONFIG_DIR = os.path.expanduser("~/.config/thinclient")
      CONFIG_FILE = os.path.join(CONFIG_DIR, "rdp.json")
      CREATE_MODE = "--create" in sys.argv
      EDIT_MODE = "--edit" in sys.argv
      EDIT_PROFILE = None
      if EDIT_MODE:
          try:
              EDIT_PROFILE = os.path.abspath(sys.argv[sys.argv.index("--edit") + 1])
          except (ValueError, IndexError):
              raise SystemExit("Missing RDP profile")
      
      DEFAULTS = {
          "computer": "", "port": "3389", "username": "", "domain": "",
          "fullscreen": True, "multimon": False, "dynamic_resolution": True,
          "resolution": "1920x1080", "scale": "100", "clipboard": True,
          "audio": True, "microphone": False, "network": "auto", "remember": True
      }
      
      def load_settings():
          data = DEFAULTS.copy()
          source = EDIT_PROFILE if EDIT_MODE and EDIT_PROFILE else CONFIG_FILE
          try:
              with open(source, "r", encoding="utf-8") as f:
                  data.update(json.load(f))
          except Exception:
              pass
          return data
      
      class RDPWindow(Gtk.Window):
          def __init__(self):
              super().__init__(title="Remote Desktop")
              self.settings = load_settings()
              self.set_default_size(620, 590)
              self.set_position(Gtk.WindowPosition.CENTER)
              self.set_resizable(False)
              self.set_border_width(24)
              self.connect("destroy", Gtk.main_quit)
      
              main = Gtk.Box(orientation=Gtk.Orientation.VERTICAL, spacing=15)
              self.add(main)
              title = Gtk.Label()
              title.set_markup("<span size='x-large' weight='bold'>Remote Desktop</span>")
              main.pack_start(title, False, False, 0)
              if EDIT_MODE:
                  subtitle_text = "Edit the saved Remote Desktop connection"
              elif CREATE_MODE:
                  subtitle_text = "Create a Remote Desktop connection on the desktop"
              else:
                  subtitle_text = "Configure and connect to a Windows computer"
              subtitle = Gtk.Label(label=subtitle_text)
              main.pack_start(subtitle, False, False, 0)
      
              notebook = Gtk.Notebook()
              main.pack_start(notebook, True, True, 5)
              notebook.append_page(self.connection_page(), Gtk.Label(label="Connection"))
              notebook.append_page(self.display_page(), Gtk.Label(label="Display"))
              notebook.append_page(self.resources_page(), Gtk.Label(label="Resources"))
              notebook.append_page(self.network_page(), Gtk.Label(label="Network"))
      
              self.status = Gtk.Label()
              self.status.set_halign(Gtk.Align.START)
              main.pack_start(self.status, False, False, 0)
              buttons = Gtk.Box(orientation=Gtk.Orientation.HORIZONTAL, spacing=12)
              cancel = Gtk.Button(label="Cancel")
              action = Gtk.Button(label="Save" if EDIT_MODE else "Create" if CREATE_MODE else "Connect")
              cancel.set_size_request(130, 42)
              action.set_size_request(130, 42)
              cancel.connect("clicked", lambda *_: Gtk.main_quit())
              if EDIT_MODE:
                  action.connect("clicked", self.save_edited_connection)
              elif CREATE_MODE:
                  action.connect("clicked", self.create_desktop_connection)
              else:
                  action.connect("clicked", self.connect_rdp)
              buttons.pack_end(action, False, False, 0)
              buttons.pack_end(cancel, False, False, 0)
              main.pack_end(buttons, False, False, 0)
              self.set_default(action)
      
          def make_grid(self):
              grid = Gtk.Grid()
              grid.set_border_width(18)
              grid.set_column_spacing(18)
              grid.set_row_spacing(14)
              return grid
      
          def add_label(self, grid, text, row):
              label = Gtk.Label(label=text)
              label.set_halign(Gtk.Align.START)
              grid.attach(label, 0, row, 1, 1)
      
          def connection_page(self):
              grid = self.make_grid()
              self.add_label(grid, "Computer", 0)
              self.computer = Gtk.Entry()
              self.computer.set_placeholder_text("Server name or IP address")
              self.computer.set_text(str(self.settings.get("computer", "")))
              self.computer.set_hexpand(True)
              grid.attach(self.computer, 1, 0, 1, 1)
      
              self.add_label(grid, "Port", 1)
              self.port = Gtk.Entry()
              self.port.set_text(str(self.settings.get("port", "3389")))
              self.port.set_max_length(5)
              grid.attach(self.port, 1, 1, 1, 1)
      
              self.add_label(grid, "Username", 2)
              self.username = Gtk.Entry()
              self.username.set_text(str(self.settings.get("username", "")))
              grid.attach(self.username, 1, 2, 1, 1)
      
              self.add_label(grid, "Domain", 3)
              self.domain = Gtk.Entry()
              self.domain.set_text(str(self.settings.get("domain", "")))
              self.domain.set_placeholder_text("Optional")
              grid.attach(self.domain, 1, 3, 1, 1)
      
              self.add_label(grid, "Password", 4)
              self.password = Gtk.Entry()
              self.password.set_visibility(False)
              self.password.set_invisible_char("●")
              self.password.set_activates_default(True)
              if CREATE_MODE or EDIT_MODE:
                  self.password.set_sensitive(False)
                  self.password.set_placeholder_text("Requested when the saved connection is opened")
              grid.attach(self.password, 1, 4, 1, 1)
      
              self.remember = Gtk.CheckButton(label="Save connection settings" if (CREATE_MODE or EDIT_MODE) else "Remember connection settings")
              self.remember.set_active(True if (CREATE_MODE or EDIT_MODE) else bool(self.settings.get("remember", True)))
              if CREATE_MODE or EDIT_MODE:
                  self.remember.set_sensitive(False)
              grid.attach(self.remember, 1, 5, 1, 1)
              note = Gtk.Label(label="The password is never saved.")
              note.set_halign(Gtk.Align.START)
              grid.attach(note, 1, 6, 1, 1)
              return grid
      
          def display_page(self):
              grid = self.make_grid()
              self.fullscreen = Gtk.CheckButton(label="Full Screen")
              self.fullscreen.set_active(bool(self.settings.get("fullscreen", True)))
              grid.attach(self.fullscreen, 0, 0, 2, 1)
              self.multimon = Gtk.CheckButton(label="Use Multiple Monitors")
              self.multimon.set_active(bool(self.settings.get("multimon", False)))
              grid.attach(self.multimon, 0, 1, 2, 1)
              self.dynamic_resolution = Gtk.CheckButton(label="Dynamic Resolution")
              self.dynamic_resolution.set_active(bool(self.settings.get("dynamic_resolution", True)))
              grid.attach(self.dynamic_resolution, 0, 2, 2, 1)
              self.add_label(grid, "Resolution", 3)
              self.resolution = Gtk.ComboBoxText()
              resolutions = ["1920x1080", "1600x900", "1366x768", "1280x720", "1024x768"]
              for value in resolutions:
                  self.resolution.append_text(value)
              try:
                  idx = resolutions.index(str(self.settings.get("resolution", "1920x1080")))
              except ValueError:
                  idx = 0
              self.resolution.set_active(idx)
              grid.attach(self.resolution, 1, 3, 1, 1)
              self.add_label(grid, "Scaling", 4)
              self.scale = Gtk.ComboBoxText()
              scales = ["100", "140", "180"]
              for value in scales:
                  self.scale.append_text(value + "%")
              try:
                  idx = scales.index(str(self.settings.get("scale", "100")))
              except ValueError:
                  idx = 0
              self.scale.set_active(idx)
              grid.attach(self.scale, 1, 4, 1, 1)
              return grid
      
          def resources_page(self):
              grid = self.make_grid()
              self.clipboard = Gtk.CheckButton(label="Enable Clipboard")
              self.clipboard.set_active(bool(self.settings.get("clipboard", True)))
              grid.attach(self.clipboard, 0, 0, 2, 1)
              self.audio = Gtk.CheckButton(label="Play Remote Audio Locally")
              self.audio.set_active(bool(self.settings.get("audio", True)))
              grid.attach(self.audio, 0, 1, 2, 1)
              self.microphone = Gtk.CheckButton(label="Redirect Microphone")
              self.microphone.set_active(bool(self.settings.get("microphone", False)))
              grid.attach(self.microphone, 0, 2, 2, 1)
              return grid
      
          def network_page(self):
              grid = self.make_grid()
              self.add_label(grid, "Connection Type", 0)
              self.network = Gtk.ComboBoxText()
              for key, label in [
                  ("auto", "Automatic"), ("lan", "LAN"), ("wan", "WAN"),
                  ("broadband-high", "Broadband - High"), ("broadband-low", "Broadband - Low")
              ]:
                  self.network.append(key, label)
              self.network.set_active_id(str(self.settings.get("network", "auto")))
              grid.attach(self.network, 1, 0, 1, 1)
              security = Gtk.Label()
              security.set_markup("<b>Certificate verification:</b> Trust On First Use")
              security.set_halign(Gtk.Align.START)
              grid.attach(security, 0, 2, 2, 1)
              return grid
      
          def validate(self):
              computer = self.computer.get_text().strip()
              port = self.port.get_text().strip() or "3389"
              if not computer:
                  self.status.set_markup("<span foreground='red'>Please enter a computer name or IP address.</span>")
                  self.computer.grab_focus()
                  return None
              try:
                  p = int(port)
                  if not 1 <= p <= 65535:
                      raise ValueError
              except ValueError:
                  self.status.set_markup("<span foreground='red'>Port must be between 1 and 65535.</span>")
                  self.port.grab_focus()
                  return None
              return computer, port
      
          def data(self, computer, port):
              return {
                  "computer": computer,
                  "port": port,
                  "username": self.username.get_text().strip(),
                  "domain": self.domain.get_text().strip(),
                  "fullscreen": self.fullscreen.get_active(),
                  "multimon": self.multimon.get_active(),
                  "dynamic_resolution": self.dynamic_resolution.get_active(),
                  "resolution": self.resolution.get_active_text(),
                  "scale": self.scale.get_active_text().replace("%", ""),
                  "clipboard": self.clipboard.get_active(),
                  "audio": self.audio.get_active(),
                  "microphone": self.microphone.get_active(),
                  "network": self.network.get_active_id(),
                  "remember": True if (CREATE_MODE or EDIT_MODE) else self.remember.get_active(),
              }
      
          def save_global(self, data):
              os.makedirs(CONFIG_DIR, mode=0o700, exist_ok=True)
              if not self.remember.get_active():
                  try:
                      os.remove(CONFIG_FILE)
                  except FileNotFoundError:
                      pass
                  return
              with open(CONFIG_FILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              os.chmod(CONFIG_FILE, 0o600)
      
          def save_edited_connection(self, _button):
              valid = self.validate()
              if not valid:
                  return
              computer, port = valid
              data = self.data(computer, port)
              with open(EDIT_PROFILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              os.chmod(EDIT_PROFILE, 0o600)
              dialog = Gtk.MessageDialog(transient_for=self, modal=True, message_type=Gtk.MessageType.INFO,
                                         buttons=Gtk.ButtonsType.OK, text="Connection settings updated.")
              dialog.run(); dialog.destroy(); Gtk.main_quit()
      
          def create_desktop_connection(self, _button):
              valid = self.validate()
              if not valid:
                  return
              computer, port = valid
              data = self.data(computer, port)
              profile_dir = os.path.join(CONFIG_DIR, "rdp-connections")
              os.makedirs(profile_dir, mode=0o700, exist_ok=True)
              slug = re.sub(r"[^A-Za-z0-9._-]+", "-", computer).strip("-._") or "remote-desktop"
              if port != "3389":
                  slug += "-" + port
              profile_file = os.path.join(profile_dir, slug + ".json")
              desktop_dir = os.path.expanduser("~/Desktop")
              os.makedirs(desktop_dir, mode=0o755, exist_ok=True)
              desktop_file = os.path.join(desktop_dir, "RDP-" + slug + ".desktop")
              if os.path.exists(profile_file) or os.path.exists(desktop_file):
                  confirm = Gtk.MessageDialog(
                      transient_for=self, modal=True, message_type=Gtk.MessageType.QUESTION,
                      buttons=Gtk.ButtonsType.YES_NO,
                      text=f"A connection to '{computer}' already exists on the desktop."
                  )
                  confirm.format_secondary_text("Replace it with these settings?")
                  response = confirm.run(); confirm.destroy()
                  if response != Gtk.ResponseType.YES:
                      return
              with open(profile_file, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              os.chmod(profile_file, 0o600)

              display_name = f"RDP - {computer}"
              desktop_data = (
                  "[Desktop Entry]\n"
                  "Type=Application\n"
                  "Version=1.0\n"
                  f"Name={display_name}\n"
                  f"Comment=Remote Desktop connection to {computer}:{port}\n"
                  f"Exec=/usr/local/bin/thinclient-rdp-profile {profile_file}\n"
                  "Icon=computer-symbolic\n"
                  "Terminal=false\n"
                  "Categories=Network;\n"
                  "StartupNotify=true\n"
              )
              with open(desktop_file, "w", encoding="utf-8") as f:
                  f.write(desktop_data)
              os.chmod(desktop_file, 0o755)
              subprocess.run(["/usr/bin/gio", "set", "-t", "string", desktop_file, "metadata::trusted", "true"],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              dialog = Gtk.MessageDialog(transient_for=self, modal=True, message_type=Gtk.MessageType.INFO,
                                         buttons=Gtk.ButtonsType.OK, text="Remote Desktop connection created.")
              dialog.format_secondary_text(f"{display_name} has been added to the desktop.")
              dialog.run(); dialog.destroy(); Gtk.main_quit()
      
          def connect_rdp(self, _button):
              valid = self.validate()
              if not valid:
                  return
              computer, port = valid
              data = self.data(computer, port)
              self.save_global(data)
              args = ["/usr/bin/xfreerdp3", f"/v:{computer}", f"/port:{port}", "/cert:tofu", "/from-stdin:force"]
              if data["username"]: args.append(f"/u:{data['username']}")
              if data["domain"]: args.append(f"/d:{data['domain']}")
              if data["network"]: args.append(f"/network:{data['network']}")
              if data["scale"]: args.append(f"/scale:{data['scale']}")
              if data["fullscreen"]: args.append("/f")
              if data["multimon"]: args.append("/multimon")
              if data["dynamic_resolution"]: args.append("+dynamic-resolution")
              elif data["resolution"]: args.append(f"/size:{data['resolution']}")
              if data["clipboard"]: args.append("+clipboard")
              if data["audio"]: args.append("/sound")
              if data["microphone"]: args.append("/microphone")
              try:
                  log = open("/tmp/thinclient-rdp.log", "w", buffering=1)
                  proc = subprocess.Popen(args, stdin=subprocess.PIPE, stdout=log, stderr=subprocess.STDOUT,
                                          text=True, start_new_session=True)
                  proc.stdin.write(self.password.get_text() + "\n")
                  proc.stdin.flush(); proc.stdin.close()
                  self.password.set_text("")
                  Gtk.main_quit()
              except Exception:
                  self.password.set_text("")
                  self.status.set_markup("<span foreground='red'>Unable to start Remote Desktop.</span>")
      
      window = RDPWindow()
      window.show_all()
      window.computer.grab_focus()
      Gtk.main()
