              self.connect("destroy", Gtk.main_quit)
              box = Gtk.Box(orientation=Gtk.Orientation.VERTICAL, spacing=16)
              self.add(box)
              title = Gtk.Label(); title.set_markup("<span size='x-large' weight='bold'>Remote Desktop</span>")
              box.pack_start(title, False, False, 0)
              computer = str(settings.get("computer", "")); port = str(settings.get("port", "3389"))
              box.pack_start(Gtk.Label(label=f"{computer}:{port}"), False, False, 0)
              self.password = Gtk.Entry(); self.password.set_visibility(False); self.password.set_invisible_char("●")
              self.password.set_placeholder_text("Password"); self.password.set_activates_default(True)
              box.pack_start(self.password, False, False, 0)
              buttons = Gtk.Box(orientation=Gtk.Orientation.HORIZONTAL, spacing=12)
              cancel = Gtk.Button(label="Cancel"); connect = Gtk.Button(label="Connect")
              cancel.set_size_request(120, 40); connect.set_size_request(120, 40)
              cancel.connect("clicked", lambda *_: Gtk.main_quit()); connect.connect("clicked", self.connect_rdp)
              buttons.pack_end(connect, False, False, 0); buttons.pack_end(cancel, False, False, 0)
              box.pack_end(buttons, False, False, 0); self.set_default(connect)
      
          def connect_rdp(self, _button):
              data = settings
              computer = str(data.get("computer", "")).strip(); port = str(data.get("port", "3389")).strip()
              args = ["/usr/bin/xfreerdp3", f"/v:{computer}", f"/port:{port}", "/cert:tofu", "/from-stdin:force"]
              if data.get("username"): args.append(f"/u:{data['username']}")
              if data.get("domain"): args.append(f"/d:{data['domain']}")
              if data.get("network"): args.append(f"/network:{data['network']}")
              if data.get("scale"): args.append(f"/scale:{data['scale']}")
              if data.get("fullscreen", True): args.append("/f")
              if data.get("multimon", False): args.append("/multimon")
              if data.get("dynamic_resolution", True): args.append("+dynamic-resolution")
              elif data.get("resolution"): args.append(f"/size:{data['resolution']}")
              if data.get("clipboard", True): args.append("+clipboard")
              if data.get("audio", True): args.append("/sound")
              if data.get("microphone", False): args.append("/microphone")
              try:
                  log = open("/tmp/thinclient-rdp.log", "w", buffering=1)
                  proc = subprocess.Popen(args, stdin=subprocess.PIPE, stdout=log, stderr=subprocess.STDOUT,
                                          text=True, start_new_session=True)
                  proc.stdin.write(self.password.get_text() + "\n"); proc.stdin.flush(); proc.stdin.close()
                  self.password.set_text(""); Gtk.main_quit()
              except Exception:
                  self.password.set_text("")
      
      window = PasswordDialog(); window.show_all(); window.password.grab_focus(); Gtk.main()
