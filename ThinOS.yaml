      chmod 755 /usr/local/bin/thinclient-control-panel

      # Administrator authentication uses the vdi account through PAM. The kiosk
      # account may invoke only this exact PAM authentication command and a small,
      # predefined administrator-tool backend.
      cat > /usr/local/bin/thinclient-admin-mode <<'PY'
      #!/usr/bin/python3

      import gi
      import os
      import subprocess

      gi.require_version("Gtk", "3.0")

      from gi.repository import Gtk, Gdk


      RUNTIME_DIR = os.environ.get(
          "XDG_RUNTIME_DIR",
          f"/run/user/{os.getuid()}"
      )

      MARKER = os.path.join(
          RUNTIME_DIR,
          "thinclient-admin-mode"
      )

      DIALOG_CSS = b"""
      .thinclient-dim-label {
          color: #6c6c6c;
          font-size: 12px;
      }

      .thinclient-error-title {
          color: #c01c28;
          font-weight: bold;
      }
      """


      def apply_css():
          provider = Gtk.CssProvider()
          provider.load_from_data(DIALOG_CSS)

          Gtk.StyleContext.add_provider_for_screen(
              Gdk.Screen.get_default(),
              provider,
              Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION
          )


      def add_window_buttons(window, header):
          close_button = Gtk.Button.new_from_icon_name(
              "window-close-symbolic", Gtk.IconSize.BUTTON
          )
          close_button.set_tooltip_text("Close")
          close_button.connect("clicked", lambda *_: window.close())
          header.pack_end(close_button)


      class AdministratorLogin(Gtk.Application):

          def __init__(self):
              super().__init__(
                  application_id="com.vdi.AdministratorLogin"
              )

              self.window = None
              self.password = None
              self.error_title = None
              self.error_subtitle = None
              self.error_box = None
              self.unlock_button = None

          def do_activate(self):
              apply_css()

              self.window = Gtk.ApplicationWindow(
                  application=self
              )

              self.window.set_title(
                  "Administrator Login"
              )

              self.window.set_default_size(
                  520,
                  340
              )

              self.window.set_resizable(False)

              header = Gtk.HeaderBar()
              header.set_title("Administrator Login")
              header.set_subtitle("VDI Thin Client")
              add_window_buttons(self.window, header)
              self.window.set_titlebar(header)

              root = Gtk.Box(
                  orientation=Gtk.Orientation.VERTICAL,
                  spacing=10
              )

              root.set_border_width(24)

              heading = Gtk.Label()
              heading.set_markup("<b>Administrator Authentication</b>")
              heading.set_xalign(0)
              root.pack_start(heading, False, False, 0)

              description = Gtk.Label(
                  label=(
                      "Enter the VDI administrator password "
                      "to unlock administrative settings."
                  )
              )

              description.set_xalign(0)
              description.set_line_wrap(True)
              description.get_style_context().add_class("thinclient-dim-label")
              description.set_margin_bottom(6)
              root.pack_start(description, False, False, 0)

              self.password = Gtk.Entry()
              self.password.set_visibility(False)
              self.password.set_invisible_char("●")
              self.password.set_placeholder_text("Password")

              self.password.connect(
                  "activate",
                  lambda *_: self.authenticate()
              )

              root.pack_start(self.password, False, False, 0)

              self.error_box = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=8
              )

              self.error_box.set_margin_top(6)
              self.error_box.set_no_show_all(True)

              error_icon = Gtk.Image.new_from_icon_name(
                  "dialog-error-symbolic", Gtk.IconSize.BUTTON
              )

              self.error_box.pack_start(error_icon, False, False, 0)

              error_text_box = Gtk.Box(
                  orientation=Gtk.Orientation.VERTICAL,
                  spacing=2
              )

              self.error_title = Gtk.Label()
              self.error_title.set_xalign(0)

              self.error_title.get_style_context().add_class(
                  "thinclient-error-title"
              )

              self.error_subtitle = Gtk.Label()
              self.error_subtitle.set_xalign(0)

              self.error_subtitle.get_style_context().add_class(
                  "thinclient-dim-label"
              )

              error_text_box.pack_start(self.error_title, False, False, 0)
              error_text_box.pack_start(self.error_subtitle, False, False, 0)
              self.error_box.pack_start(error_text_box, True, True, 0)
              root.pack_start(self.error_box, False, False, 0)

              spacer = Gtk.Box()
              root.pack_start(spacer, True, True, 0)

              actions = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=10
              )

              cancel = Gtk.Button(label="Cancel")
              cancel.set_hexpand(True)

              cancel.connect(
                  "clicked",
                  lambda *_: self.window.close()
              )

              self.unlock_button = Gtk.Button(
                  label="Unlock Administrator Mode"
              )

              self.unlock_button.set_hexpand(True)

              self.unlock_button.get_style_context().add_class(
                  "suggested-action"
              )

              self.unlock_button.connect(
                  "clicked",
                  lambda *_: self.authenticate()
              )

              actions.pack_start(cancel, True, True, 0)
              actions.pack_start(self.unlock_button, True, True, 0)
              root.pack_start(actions, False, False, 0)

              self.window.add(root)
              self.window.show_all()
              self.error_box.set_visible(False)
              self.window.present()
              self.password.grab_focus()

          def set_busy(self, busy):
              self.password.set_sensitive(not busy)
              self.unlock_button.set_sensitive(not busy)

              if busy:
                  self.unlock_button.set_label(
                      "Authenticating…"
                  )
              else:
                  self.unlock_button.set_label(
                      "Unlock Administrator Mode"
                  )

          def authenticate(self):
              password = self.password.get_text()
              self.error_box.set_visible(False)

              if not password:
                  self.error_title.set_text(
                      "Password required"
                  )

                  self.error_subtitle.set_text(
                      "Enter the VDI administrator password."
                  )

                  self.error_box.set_visible(True)
                  self.password.grab_focus()
                  return

              self.set_busy(True)

              try:
                  result = subprocess.run(
                      [
                          "sudo",
                          "-n",
                          "/usr/bin/pamtester",
                          "login",
                          "vdi",
                          "authenticate"
                      ],
                      input=password + "\n",
                      text=True,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                      timeout=15
                  )

              except Exception:
                  result = None

              self.password.set_text("")

              if result is not None and result.returncode == 0:
                  os.makedirs(
                      RUNTIME_DIR,
                      mode=0o700,
                      exist_ok=True
                  )

                  fd = os.open(
                      MARKER,
                      os.O_WRONLY |
                      os.O_CREAT |
                      os.O_TRUNC,
                      0o600
                  )

                  os.close(fd)
                  self.window.close()
                  return

              self.set_busy(False)

              self.error_title.set_text(
                  "Incorrect administrator password"
              )

              self.error_subtitle.set_text(
                  "Please verify the password and try again."
              )

              self.error_box.set_visible(True)
              self.password.grab_focus()


      app = AdministratorLogin()
      app.run()
      PY
