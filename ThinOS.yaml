          def build_network(self):
              interface, address, gateway, dns = network_info()

              page = Adw.PreferencesPage()

              connection = Adw.PreferencesGroup(
                  title="Connection"
              )

              rows = [
                  (
                      "Status",
                      "Connected" if address else "Disconnected",
                      "network-wired-symbolic"
                  ),
                  (
                      "Interface",
                      interface or "Not available",
                      "network-wired-symbolic"
                  ),
                  (
                      "IPv4 address",
                      address or "Not assigned",
                      "network-transmit-receive-symbolic"
                  ),
              ]

              for title, subtitle, icon in rows:
                  row = Adw.ActionRow(
                      title=title,
                      subtitle=subtitle
                  )
                  add_icon(row, icon)
                  connection.add(row)

              page.add(connection)

              ipv4 = Adw.PreferencesGroup(title="IPv4")

              for title, value in [
                  ("Gateway", gateway),
                  ("DNS servers", dns),
              ]:
                  row = Adw.ActionRow(
                      title=title,
                      subtitle=value or "Not available"
                  )
                  ipv4.add(row)

              page.add(ipv4)

              self.wifi_group = Adw.PreferencesGroup(title="Wi-Fi Networks")
              self.wifi_rows = []

              scan_button = Gtk.Button(label="Scan for Networks")
              scan_button.add_css_class("suggested-action")
              scan_button.set_margin_top(6)
              scan_button.set_margin_bottom(6)
              scan_button.connect("clicked", self.refresh_wifi)
              self.wifi_group.add(scan_button)

              page.add(self.wifi_group)

              advanced = Adw.PreferencesGroup(title="Advanced")

              editor_row = Adw.ActionRow(
                  title="Network Connections",
                  subtitle="Edit wired, Wi-Fi, and VPN connections - just like Ubuntu's own network settings"
              )

              add_icon(editor_row, "preferences-system-network-symbolic")

