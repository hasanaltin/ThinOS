          def build_updates(self):
              page = Adw.PreferencesPage()

              if not admin_enabled():
                  group = Adw.PreferencesGroup(title="Software Updates")

                  row = Adw.ActionRow(
                      title="Administrator access required",
                      subtitle="Unlock Administrator Mode to check for updates."
                  )

                  add_icon(row, "changes-prevent-symbolic")
                  group.add(row)
                  page.add(group)
                  self.stack.add_named(page, "updates")
                  return

              group = Adw.PreferencesGroup(title="Software Updates")

              self.update_row = Adw.ActionRow(
                  title="Ubuntu and ThinOS Updates",
                  subtitle="Check for and install the latest updates."
              )

              add_icon(self.update_row, "software-update-available-symbolic")

              self.update_button = Gtk.Button(label="Check for Updates")
              self.update_button.add_css_class("suggested-action")
              self.update_button.set_valign(Gtk.Align.CENTER)
              self.update_button.connect("clicked", self.start_update)
              self.update_row.add_suffix(self.update_button)

              group.add(self.update_row)

              self.update_progress = Gtk.ProgressBar()
              self.update_progress.set_show_text(False)
              self.update_progress.set_margin_start(12)
              self.update_progress.set_margin_end(12)
              self.update_progress.set_margin_top(6)
              self.update_progress.set_margin_bottom(6)
              self.update_progress.set_visible(False)

              group.add(self.update_progress)
              page.add(group)

              log_group = Adw.PreferencesGroup(title="Progress")

              scroller = Gtk.ScrolledWindow()
              scroller.set_min_content_height(280)
              scroller.set_vexpand(True)

              self.update_log = Gtk.TextView()
              self.update_log.set_editable(False)
              self.update_log.set_cursor_visible(False)
              self.update_log.set_monospace(True)
              self.update_log.set_left_margin(8)
              self.update_log.set_top_margin(8)
              self.update_log.set_bottom_margin(8)
              self.update_log_buffer = self.update_log.get_buffer()

              scroller.set_child(self.update_log)
              log_group.add(scroller)
              page.add(log_group)

              self.update_running = False

              self.stack.add_named(page, "updates")

          def append_update_log(self, text):
              end = self.update_log_buffer.get_end_iter()
              self.update_log_buffer.insert(end, text)

              mark = self.update_log_buffer.create_mark(
                  None, self.update_log_buffer.get_end_iter(), False
              )

              self.update_log.scroll_to_mark(mark, 0.0, False, 0.0, 1.0)
              return False

          def pulse_update_progress(self):
              if not self.update_running:
                  return False

              self.update_progress.pulse()
              return True

          def start_update(self, _button):
              if self.update_running:
                  return

              self.update_running = True
              self.update_button.set_sensitive(False)
              self.update_button.set_label("Updating…")
              self.update_row.set_subtitle("Update in progress…")
              self.update_progress.set_visible(True)
              self.update_log_buffer.set_text("")

              GLib.timeout_add(150, self.pulse_update_progress)

              threading.Thread(
                  target=self.run_update,
                  daemon=True
              ).start()

          def run_update(self):
              success = False

              try:
                  proc = subprocess.Popen(
                      [
                          "sudo", "-n",
                          "/usr/local/sbin/thinclient-admin-tool",
                          "updates"
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )

                  for line in proc.stdout:
                      GLib.idle_add(self.append_update_log, line)

                  proc.wait()
                  success = proc.returncode == 0

              except Exception as exc:
                  GLib.idle_add(
                      self.append_update_log,
                      f"\nFailed to start update: {exc}\n"
                  )

              GLib.idle_add(self.finish_update, success)

          def finish_update(self, success):
              self.update_running = False
              self.update_progress.set_visible(False)
              self.update_button.set_sensitive(True)
              self.update_button.set_label("Check for Updates")

              self.update_row.set_subtitle(
                  "Up to date."
                  if success
                  else "Update failed. See the log above for details."
              )

              return False


