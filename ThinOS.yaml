          def show_network(
              self,
              button
          ):
              popover = Gtk.Popover.new(button)

              box = Gtk.Box(
                  orientation=Gtk.Orientation.VERTICAL,
                  spacing=8
              )
              box.set_border_width(14)

              title = Gtk.Label()
              title.set_markup("<b>Network</b>")
              title.set_xalign(0)

              route = command(
                  ["ip", "route", "show", "default"]
              )

              interface = ""
              gateway = ""

              if route:
                  pieces = route.split()

                  if "dev" in pieces:
                      interface = pieces[
                          pieces.index("dev") + 1
                      ]

                  if "via" in pieces:
                      gateway = pieces[
                          pieces.index("via") + 1
                      ]

              address = ""

              if interface:
                  raw = command([
                      "ip",
                      "-4",
                      "-o",
                      "addr",
                      "show",
                      "dev",
                      interface
                  ])

                  fields = raw.split()

                  if "inet" in fields:
                      address = fields[
                          fields.index("inet") + 1
                      ].split("/")[0]

              status = Gtk.Label(
                  label=(
                      "Connected"
                      if address
                      else "Disconnected"
                  )
              )
              status.set_xalign(0)

              detail = Gtk.Label(
                  label=(
                      f"Ethernet · {interface}\n"
                      f"{address}"
                      if address
                      else "No active connection"
                  )
              )
              detail.set_xalign(0)

              settings_button = Gtk.Button(
                  label="Network Settings…"
              )

              settings_button.connect(
                  "clicked",
                  lambda *_: (
                      popover.popdown(),
                      spawn("/usr/local/bin/thinclient-control-panel")
                  )
              )

              box.pack_start(
                  title,
                  False,
                  False,
                  0
              )
              box.pack_start(
                  status,
                  False,
                  False,
                  0
              )
              box.pack_start(
                  detail,
                  False,
                  False,
                  0
              )
              box.pack_start(
                  settings_button,
                  False,
                  False,
                  4
              )

              popover.add(box)
              popover.show_all()
              popover.popup()

          def show_volume(
              self,
              button
          ):
              popover = Gtk.Popover.new(button)

              box = Gtk.Box(
                  orientation=Gtk.Orientation.VERTICAL,
                  spacing=10
              )
              box.set_border_width(14)

              title = Gtk.Label()
              title.set_markup("<b>Sound</b>")
              title.set_xalign(0)

              scale = Gtk.Scale.new_with_range(
                  Gtk.Orientation.HORIZONTAL,
                  0,
                  100,
                  1
              )

              raw = command([
                  "pactl",
                  "get-sink-volume",
                  "@DEFAULT_SINK@"
              ])

              volume = 50

              for token in raw.split():
                  if token.endswith("%"):
                      try:
                          volume = int(token[:-1])
                          break
                      except ValueError:
                          pass

              scale.set_value(volume)
              scale.set_size_request(210, -1)

              value_label = Gtk.Label(
                  label=f"{volume}%"
              )
              value_label.set_xalign(0)

              def volume_changed(widget):
                  value = int(widget.get_value())
                  value_label.set_text(f"{value}%")

                  subprocess.Popen([
                      "pactl",
                      "set-sink-volume",
                      "@DEFAULT_SINK@",
                      f"{value}%"
                  ])

              scale.connect(
                  "value-changed",
                  volume_changed
              )

              box.pack_start(
                  title,
                  False,
                  False,
                  0
              )
              box.pack_start(
                  scale,
                  False,
                  False,
                  0
              )
              box.pack_start(
                  value_label,
                  False,
                  False,
                  0
              )

              popover.add(box)
              popover.show_all()
              popover.popup()

