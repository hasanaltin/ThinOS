          def launch_admin_tool(
              self,
              _item,
              action,
              title
          ):
              # Activating a menu item automatically closes it and every
              # parent menu in the chain - no manual popdown/hide needed.

              # Most administrator tools are real graphical applications that
              # need no special privilege. Terminal and Check for Updates are
              # the exceptions: they need root, so they run through the
              # sudoers-gated thinclient-admin-tool wrapper instead.
              #
              # Terminal must be launched through thinclient-admin-terminal
              # (not a plain gnome-terminal) so its PID is tracked: that lets
              # thinclient-exit-admin close the privileged shell the moment
              # Administrator Mode is exited, instead of leaving it running.
              commands = {
                  "terminal": [
                      "/usr/local/bin/thinclient-admin-terminal"
                  ],
                  "netstats": [
                      "gnome-system-monitor",
                      "--show-resources-tab"
                  ],
                  "updates": [
                      "gnome-terminal", "--",
                      "/bin/bash", "-lc",
                      (
                          "sudo -n /usr/local/sbin/thinclient-admin-tool "
                          "updates"
                      )
                  ],
                  "editor": [
                      "gnome-text-editor"
                  ],
                  "taskmgr": [
                      "gnome-system-monitor",
                      "--show-processes-tab"
                  ],
                  "logs": [
                      "gnome-logs"
                  ],
                  "filemanager": [
                      "nemo"
                  ],
                  "screenshot": [
                      "gnome-screenshot",
                      "-i"
                  ],
              }

              argv = commands.get(action)
              if not argv:
                  return

              subprocess.Popen(
                  argv,
                  start_new_session=True
              )

          def add_power_item(self, menu):
              row = Gtk.MenuItem()
