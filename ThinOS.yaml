              self.build_updates()

              self.window.add(root)

              self.show_page(
                  "overview",
                  "Control Center",
                  "VDI Thin Client"
              )

              self.window.show_all()
              self.update_progress.set_visible(False)
              self.window.present()

          def show_page(
              self,
              name,
              title,
              subtitle="Settings"
          ):
              self.stack.set_visible_child_name(name)
              self.header.set_title(title)
              self.header.set_subtitle(subtitle)
              self.back_button.set_visible(name != "overview")

          def nav_row(
              self,
              listbox,
              title,
              subtitle,
              icon,
              page,
              page_title
          ):
              row, hbox = make_row(listbox, title, subtitle, icon)
              row.set_activatable(True)
              add_row_arrow(hbox)

              row.nav_callback = lambda: self.show_page(
                  page,
                  page_title,
                  "VDI Thin Client"
              )

              return row

          def build_overview(self):
              interface, address, gateway, dns = network_info()

              page, content = new_page()

              connectivity = make_group(content, "Connectivity")

              self.nav_row(
                  connectivity,
                  "Network",
                  f"Connected · {address}" if address else "Disconnected",
                  "network-wired-symbolic",
                  "network",
                  "Network"
              )

              devices = make_group(content, "Devices")

              self.nav_row(
                  devices,
                  "Sound",
                  f"{volume_percent()}%",
                  "audio-volume-high-symbolic",
                  "sound",
                  "Sound"
              )

              displays = display_info()
              display_subtitle = (
                  displays[0][1]
                  if displays
                  else "No display information"
              )

              self.nav_row(
                  devices,
                  "Display",
                  display_subtitle,
                  "video-display-symbolic",
                  "display",
                  "Display"
              )

              layout, variant = keyboard_info()

              self.nav_row(
                  devices,
                  "Keyboard",
                  "English (US)" if layout == "us" else layout.upper(),
                  "input-keyboard-symbolic",
                  "keyboard",
                  "Keyboard"
              )

              self.nav_row(
                  devices,
                  "Mouse",
                  "Pointer settings",
                  "input-mouse-symbolic",
                  "mouse",
                  "Mouse"
              )

              administration = make_group(content, "Administration")

              self.nav_row(
                  administration,
                  "Administrator Mode",
                  "Enabled" if admin_enabled() else "Restricted",
                  (
                      "changes-allow-symbolic"
                      if admin_enabled()
                      else "changes-prevent-symbolic"
                  ),
                  "admin",
                  "Administrator Mode"
              )

              self.nav_row(
                  administration,
                  "Software Updates",
                  "Check for updates" if admin_enabled() else "Restricted",
                  "software-update-available-symbolic",
                  "updates",
                  "Software Updates"
              )

              self.stack.add_named(page, "overview")

          def build_network(self):
              interface, address, gateway, dns = network_info()

              page, content = new_page()

              connection = make_group(content, "Connection")

              rows = [
                  (
                      "Status",
                      "Connected" if address else "Disconnected",
                      "network-wired-symbolic"
                  ),
                  (
                      "Interface",
                      interface or "Not available",
                      "network-wired-symbolic"
                  ),
                  (
                      "IPv4 address",
                      address or "Not assigned",
                      "network-transmit-receive-symbolic"
                  ),
              ]

              for title, subtitle, icon in rows:
                  make_row(connection, title, subtitle, icon)

              ipv4 = make_group(content, "IPv4")

              for title, value in [
                  ("Gateway", gateway),
                  ("DNS servers", dns),
              ]:
                  make_row(ipv4, title, value or "Not available")

              self.wifi_group = make_group(content, "Wi-Fi Networks")
              self.wifi_rows = []

              scan_button = Gtk.Button(label="Scan for Networks")
              scan_button.get_style_context().add_class("suggested-action")
              scan_button.connect("clicked", self.refresh_wifi)
              scan_row = make_widget_row(self.wifi_group, scan_button)
              self.wifi_rows.append(scan_row)

              advanced = make_group(content, "Advanced")

              editor_row, editor_hbox = make_row(
                  advanced,
                  "Network Connections",
                  "Edit wired, Wi-Fi, and VPN connections - just like "
                  "Ubuntu's own network settings",
                  "preferences-system-network-symbolic"
              )

              open_button = Gtk.Button(label="Open")
              open_button.set_valign(Gtk.Align.CENTER)

              open_button.connect(
                  "clicked",
                  lambda *_: subprocess.Popen(["nm-connection-editor"])
              )

              editor_hbox.pack_end(open_button, False, False, 0)

              self.stack.add_named(page, "network")
              self.refresh_wifi(None)

          def refresh_wifi(self, _button):
              for row in self.wifi_rows[1:]:
                  self.wifi_group.remove(row)
              self.wifi_rows = self.wifi_rows[:1]

              row, _hbox = make_row(self.wifi_group, "Scanning…")
              self.wifi_rows.append(row)
              self.wifi_group.show_all()

              threading.Thread(
                  target=self.scan_wifi_thread,
                  daemon=True
              ).start()

          def scan_wifi_thread(self):
              networks = wifi_scan()
              GLib.idle_add(self.populate_wifi, networks)

          def populate_wifi(self, networks):
              for row in self.wifi_rows[1:]:
                  self.wifi_group.remove(row)
              self.wifi_rows = self.wifi_rows[:1]

              if networks is None:
                  row, _hbox = make_row(
                      self.wifi_group, "No Wi-Fi adapter detected"
                  )
                  self.wifi_rows.append(row)
                  self.wifi_group.show_all()
                  return False

              if not networks:
                  row, _hbox = make_row(
                      self.wifi_group, "No Wi-Fi networks found"
                  )
                  self.wifi_rows.append(row)
                  self.wifi_group.show_all()
                  return False

              for net in networks[:15]:
                  if net["in_use"]:
                      subtitle = "Connected"
                  elif net["secured"]:
                      subtitle = f"Secured · Signal {net['signal']}%"
                  else:
                      subtitle = f"Open · Signal {net['signal']}%"

                  icon = (
                      "network-wireless-symbolic"
                      if not net["secured"]
                      else "network-wireless-encrypted-symbolic"
                  )

                  row, hbox = make_row(
                      self.wifi_group, net["ssid"], subtitle, icon
                  )

                  if not net["in_use"]:
                      row.set_activatable(True)
                      add_row_arrow(hbox)

                      row.nav_callback = (
                          lambda ssid=net["ssid"], secured=net["secured"]:
                              self.connect_wifi(ssid, secured)
                      )

                  self.wifi_rows.append(row)

              self.wifi_group.show_all()
              return False

          def connect_wifi(self, ssid, secured):
              if secured:
                  self.prompt_wifi_password(ssid)
              else:
                  threading.Thread(
                      target=self.connect_open_network,
                      args=(ssid,),
                      daemon=True
                  ).start()

          def connect_open_network(self, ssid):
              ok, _error = wifi_connect(ssid, None)
              if ok:
                  GLib.idle_add(self.refresh_wifi, None)

          def prompt_wifi_password(self, ssid):
              dialog = Gtk.Dialog(
                  title="Wi-Fi Password",
                  transient_for=self.window,
                  modal=True
              )

              dialog.add_button("Cancel", Gtk.ResponseType.CANCEL)
              connect_button = dialog.add_button("Connect", Gtk.ResponseType.OK)
              dialog.set_default_response(Gtk.ResponseType.OK)

              content = dialog.get_content_area()
              content.set_border_width(18)
              content.set_spacing(12)

              label = Gtk.Label(
                  label=f"Enter the password for “{ssid}”"
              )
              label.set_xalign(0)
              content.pack_start(label, False, False, 0)

              entry = Gtk.Entry()
              entry.set_visibility(False)
              entry.set_invisible_char("●")
              entry.set_activates_default(True)
              content.pack_start(entry, False, False, 0)

              status = Gtk.Label()
              status.set_xalign(0)
              content.pack_start(status, False, False, 0)

              dialog.show_all()
              entry.grab_focus()

              connected = False

              while True:
                  response = dialog.run()

                  if response != Gtk.ResponseType.OK:
                      break

                  password = entry.get_text()

                  if not password:
                      status.set_markup(
                          "<span foreground='red'>Password required.</span>"
                      )
                      continue

                  entry.set_sensitive(False)
                  connect_button.set_sensitive(False)
                  status.set_text("Connecting…")

                  while Gtk.events_pending():
                      Gtk.main_iteration()

                  ok, error = wifi_connect(ssid, password)

                  if ok:
                      connected = True
                      break

                  entry.set_sensitive(True)
                  connect_button.set_sensitive(True)

                  status.set_markup(
                      "<span foreground='red'>{}</span>".format(
                          GLib.markup_escape_text(error or "Failed to connect.")
                      )
                  )

              dialog.destroy()

              if connected:
                  self.refresh_wifi(None)

          def build_sound(self):
              page, content = new_page()

              group = make_group(content, "Output")

              row, hbox = make_row(
                  group, "Volume", "Default audio output",
                  "audio-volume-high-symbolic"
              )

              scale = Gtk.Scale.new_with_range(
                  Gtk.Orientation.HORIZONTAL,
                  0,
                  100,
                  1
              )

              scale.set_size_request(240, -1)
              scale.set_value(volume_percent())
              scale.set_draw_value(False)

              def changed(widget):
                  subprocess.Popen([
                      "pactl",
                      "set-sink-volume",
                      "@DEFAULT_SINK@",
                      f"{int(widget.get_value())}%"
                  ])

              scale.connect("value-changed", changed)
              hbox.pack_end(scale, False, False, 0)

              self.stack.add_named(page, "sound")

          def build_display(self):
              page, content = new_page()

              group = make_group(content, "Connected Displays")

              displays = display_info()

              if displays:
                  for name, resolution in displays:
                      make_row(group, name, resolution, "video-display-symbolic")
              else:
                  make_row(
                      group, "Display", "No display information available"
                  )

              info = make_group(content, "Configuration")

              make_row(
                  info,
                  "Administrator access required"
                  if not admin_enabled()
                  else "Administrator Mode enabled",
                  "Display configuration is locked in kiosk mode."
                  if not admin_enabled()
                  else "Display configuration controls will be added here."
              )

              self.stack.add_named(page, "display")

          def build_keyboard(self):
              page, content = new_page()
              layout, variant = keyboard_info()

              group = make_group(content, "Keyboard")

              make_row(
                  group,
                  "Layout",
                  "English (US)" if layout == "us" else layout.upper(),
                  "input-keyboard-symbolic"
              )

              make_row(group, "Variant", variant or "Default")

              self.stack.add_named(page, "keyboard")

          def build_mouse(self):
              page, content = new_page()

              group = make_group(content, "Mouse")

              make_row(group, "Pointer", "System default", "input-mouse-symbolic")

              make_row(
                  group,
                  "Configuration",
                  "Administrator access required"
                  if not admin_enabled()
                  else "Administrator Mode enabled"
              )

              self.stack.add_named(page, "mouse")

          def build_admin(self):
              page, content = new_page()

              group = make_group(content, "Administrator Mode")

              if admin_enabled():
                  make_row(
                      group, "Administrator Mode", "Enabled",
                      "changes-allow-symbolic"
                  )

                  button = Gtk.Button(label="Exit Administrator Mode")
                  button.get_style_context().add_class("destructive-action")

                  button.connect(
                      "clicked",
                      lambda *_: subprocess.Popen(
                          ["/usr/local/bin/thinclient-exit-admin"]
                      )
                  )

                  make_widget_row(group, button)

              else:
                  make_row(
                      group, "Administrator Mode", "Restricted",
                      "changes-prevent-symbolic"
                  )

                  button = Gtk.Button(label="Unlock Administrator Mode")
                  button.get_style_context().add_class("suggested-action")

                  button.connect(
                      "clicked",
                      lambda *_: subprocess.Popen(
                          ["/usr/local/bin/thinclient-admin-mode"]
                      )
                  )

                  make_widget_row(group, button)

              self.stack.add_named(page, "admin")

          def build_updates(self):
              page, content = new_page()

              if not admin_enabled():
                  group = make_group(content, "Software Updates")

                  make_row(
                      group,
                      "Administrator access required",
                      "Unlock Administrator Mode to check for updates.",
                      "changes-prevent-symbolic"
                  )

                  self.stack.add_named(page, "updates")
                  return

              group = make_group(content, "Software Updates")

              self.update_row, update_hbox = make_row(
                  group,
                  "Ubuntu and ThinOS Updates",
                  "Check for and install the latest updates.",
                  "software-update-available-symbolic"
              )

              self.update_button = Gtk.Button(label="Check for Updates")
              self.update_button.get_style_context().add_class("suggested-action")
              self.update_button.set_valign(Gtk.Align.CENTER)
              self.update_button.connect("clicked", self.start_update)
              update_hbox.pack_end(self.update_button, False, False, 0)

              self.update_progress = Gtk.ProgressBar()
              self.update_progress.set_show_text(False)
              make_widget_row(group, self.update_progress)

              log_group = make_group(content, "Progress")

              log_row = Gtk.ListBoxRow()
              log_row.set_selectable(False)
              log_row.set_activatable(False)

              log_scroller = Gtk.ScrolledWindow()
              log_scroller.set_min_content_height(280)
              log_scroller.set_vexpand(True)

              self.update_log = Gtk.TextView()
              self.update_log.set_editable(False)
              self.update_log.set_cursor_visible(False)
              self.update_log.set_monospace(True)
              self.update_log.set_left_margin(8)
              self.update_log.set_top_margin(8)
              self.update_log.set_bottom_margin(8)
              self.update_log_buffer = self.update_log.get_buffer()

              log_scroller.add(self.update_log)
              log_row.add(log_scroller)
              log_group.add(log_row)

              self.update_running = False

              self.stack.add_named(page, "updates")

          def append_update_log(self, text):
              end = self.update_log_buffer.get_end_iter()
              self.update_log_buffer.insert(end, text)

              mark = self.update_log_buffer.create_mark(
                  None, self.update_log_buffer.get_end_iter(), False
              )

              self.update_log.scroll_to_mark(mark, 0.0, False, 0.0, 1.0)
              return False

          def pulse_update_progress(self):
              if not self.update_running:
                  return False

              self.update_progress.pulse()
              return True

          def start_update(self, _button):
              if self.update_running:
                  return

              self.update_running = True
              self.update_button.set_sensitive(False)
              self.update_button.set_label("Updating…")
              self.update_row.subtitle_label.set_text("Update in progress…")
              self.update_progress.set_visible(True)
              self.update_log_buffer.set_text("")

              GLib.timeout_add(150, self.pulse_update_progress)

              threading.Thread(
                  target=self.run_update,
                  daemon=True
              ).start()

          def run_update(self):
              success = False

              try:
                  proc = subprocess.Popen(
                      [
                          "sudo", "-n",
                          "/usr/local/sbin/thinclient-admin-tool",
                          "updates"
                      ],
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1
                  )

                  for line in proc.stdout:
                      GLib.idle_add(self.append_update_log, line)

                  proc.wait()
                  success = proc.returncode == 0

              except Exception as exc:
                  GLib.idle_add(
                      self.append_update_log,
                      f"\nFailed to start update: {exc}\n"
                  )

              GLib.idle_add(self.finish_update, success)

          def finish_update(self, success):
              self.update_running = False
              self.update_progress.set_visible(False)
              self.update_button.set_sensitive(True)
              self.update_button.set_label("Check for Updates")

              self.update_row.subtitle_label.set_text(
                  "Up to date."
                  if success
                  else "Update failed. See the log above for details."
              )

              return False


      app = ControlCenter()
      app.run()
