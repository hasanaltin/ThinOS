      #!/bin/bash
      set -u

      # Deliberately not "exec": the watchdog in thinclient-session checks
      # liveness with `pgrep -f /usr/local/bin/thinclient-panel`, which only
      # keeps matching while this string is still in some process's cmdline.
      # exec'ing into thinclient-shell would replace this process's cmdline
      # entirely, making that check always fail and spawn a new instance
      # every 5 seconds forever. Running it as a plain foreground child keeps
      # this wrapper (and its recognizable cmdline) alive for exactly as long
      # as thinclient-shell runs.
      /usr/local/bin/thinclient-shell
