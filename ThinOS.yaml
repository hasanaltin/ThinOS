      #!/usr/bin/python3
      import gi
      import os
      import subprocess

      gi.require_version("Nemo", "3.0")
      from gi.repository import GObject, Nemo


      class ThinClientConnections(GObject.GObject, Nemo.MenuProvider):

          def get_file_items(self, *args):
              items_selected = args[-1] if args else []
              if not items_selected or len(items_selected) != 1:
                  return []

              info = items_selected[0]
              if info.get_uri_scheme() != "file":
                  return []

              try:
                  path = info.get_location().get_path()
              except Exception:
                  return []

              if not path:
                  return []

              path = os.path.abspath(path)
              desktop = os.path.abspath(os.path.expanduser("~/Desktop"))
              filename = os.path.basename(path)

              if os.path.dirname(path) != desktop:
                  return []
              if not (filename.startswith("RDP-") and filename.endswith(".desktop")):
                  return []

              result = []
              for command, label, icon in [
                  ("start", "Start", "media-playback-start-symbolic"),
                  ("edit", "Edit", "document-edit-symbolic"),
                  ("copy", "Copy", "edit-copy-symbolic"),
                  ("rename", "Rename", "edit-rename-symbolic"),
                  ("delete", "Delete", "edit-delete-symbolic"),
              ]:
                  item = Nemo.MenuItem(
                      name=f"ThinClient::{command}",
                      label=label,
                      tip="",
                      icon=icon,
                  )
                  item.connect("activate", self.run_rdp_command, command, path)
                  result.append(item)
              return result

          def get_background_items(self, *args):
              create_item = Nemo.MenuItem(
                  name="ThinClient::Create",
                  label="Create",
                  tip="",
                  icon="list-add-symbolic",
              )
              create_menu = Nemo.Menu()

              for key, label, icon, command in [
                  ("Citrix", "Citrix", "network-workgroup-symbolic", ["/usr/local/bin/thinclient-citrix"]),
                  ("RDP", "RDP", "computer-symbolic", ["/usr/local/bin/thinclient-rdp", "--create"]),
                  ("Horizon", "Omnissa Horizon", "video-display-symbolic", ["/usr/local/bin/thinclient-horizon"]),
              ]:
                  item = Nemo.MenuItem(
                      name=f"ThinClient::Create::{key}",
                      label=label,
                      tip="",
                      icon=icon,
                  )
                  item.connect("activate", self.run_background_command, command)
                  create_menu.append_item(item)
              create_item.set_submenu(create_menu)

              arrange_item = Nemo.MenuItem(
                  name="ThinClient::Arrange",
                  label="Arrange",
                  tip="",
                  icon="view-sort-ascending-symbolic",
              )
              arrange_menu = Nemo.Menu()

              for label, mode in [
                  ("By Name", "name"),
                  ("By Type", "type"),
                  ("By Size", "size"),
                  ("By Modification Date", "mtime"),
              ]:
                  item = Nemo.MenuItem(
                      name=f"ThinClient::Arrange::{mode}",
                      label=label,
                      tip="",
                      icon="",
                  )
                  item.connect(
                      "activate",
                      self.run_background_command,
                      ["/usr/local/bin/thinclient-arrange", mode],
                  )
                  arrange_menu.append_item(item)
