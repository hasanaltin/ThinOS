          def refresh_network_wifi(self, win, wifi_list_box):
              for child in wifi_list_box.get_children():
                  child.destroy()

              placeholder = Gtk.Label(label="Scanning…")
              placeholder.set_xalign(0)
              placeholder.set_margin_top(4)
              placeholder.set_margin_bottom(4)
              wifi_list_box.pack_start(placeholder, False, False, 0)
              wifi_list_box.show_all()

              def scan_and_populate():
                  networks = wifi_scan()
                  GLib.idle_add(
                      self.populate_network_wifi, win, wifi_list_box, networks
                  )

              threading.Thread(target=scan_and_populate, daemon=True).start()

          def populate_network_wifi(self, win, wifi_list_box, networks):
              try:
                  for child in wifi_list_box.get_children():
                      child.destroy()

                  if networks is None:
                      row = Gtk.Label(label="No Wi-Fi adapter detected")
                      row.set_xalign(0)
                      wifi_list_box.pack_start(row, False, False, 4)
                  elif not networks:
                      row = Gtk.Label(label="No Wi-Fi networks found")
                      row.set_xalign(0)
                      wifi_list_box.pack_start(row, False, False, 4)
                  else:
                      for net in networks[:10]:
                          wifi_list_box.pack_start(
                              self.build_wifi_row(win, net), False, False, 0
                          )

                  wifi_list_box.show_all()
              except Exception:
                  pass

              return False

          def build_wifi_row(self, win, net):
              row = Gtk.Button()
              row.set_name("MenuRow")
              row.set_relief(Gtk.ReliefStyle.NONE)

              hbox = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=8
              )

              icon = Gtk.Image.new_from_icon_name(
                  "network-wireless-symbolic"
                  if not net["secured"]
                  else "network-wireless-encrypted-symbolic",
                  Gtk.IconSize.MENU
              )

              hbox.pack_start(icon, False, False, 0)

              label = Gtk.Label(label=net["ssid"])
              label.set_xalign(0)
              label.set_ellipsize(Pango.EllipsizeMode.END)
              hbox.pack_start(label, True, True, 0)

              status_label = Gtk.Label(
                  label="Connected" if net["in_use"] else f"{net['signal']}%"
              )

              hbox.pack_start(status_label, False, False, 0)
              row.add(hbox)

              if net["in_use"]:
                  row.set_sensitive(False)
              else:
                  row.connect(
                      "clicked",
                      self.on_wifi_row_clicked,
                      win,
                      net["ssid"],
                      net["secured"]
                  )

              return row

          def on_wifi_row_clicked(self, _button, win, ssid, secured):
              if secured:
                  self.prompt_wifi_password(ssid, win)
              else:
                  threading.Thread(
                      target=lambda: wifi_connect(ssid, None),
                      daemon=True
                  ).start()

          def prompt_wifi_password(self, ssid, _parent_win):
              # transient_for needs an actual Gtk.Window - the network
              # popover isn't one, so anchor the dialog to the panel itself.
              dialog = Gtk.Dialog(
                  title="Wi-Fi Password",
                  transient_for=self.panel,
                  modal=True
              )

              dialog.add_button("Cancel", Gtk.ResponseType.CANCEL)
              connect_button = dialog.add_button("Connect", Gtk.ResponseType.OK)
              dialog.set_default_response(Gtk.ResponseType.OK)

              content = dialog.get_content_area()
              content.set_border_width(18)
              content.set_spacing(12)

              label = Gtk.Label(
                  label=f"Enter the password for “{ssid}”"
              )
              label.set_xalign(0)
              content.pack_start(label, False, False, 0)

              entry = Gtk.Entry()
              entry.set_visibility(False)
              entry.set_invisible_char("●")
              entry.set_activates_default(True)
              content.pack_start(entry, False, False, 0)

              status = Gtk.Label()
              status.set_xalign(0)
              content.pack_start(status, False, False, 0)

              dialog.show_all()
              entry.grab_focus()

              while True:
                  response = dialog.run()

                  if response != Gtk.ResponseType.OK:
                      break

                  password = entry.get_text()

                  if not password:
                      status.set_markup(
                          "<span foreground='red'>Password required.</span>"
                      )
                      continue

                  entry.set_sensitive(False)
                  connect_button.set_sensitive(False)
                  status.set_text("Connecting…")

                  while Gtk.events_pending():
                      Gtk.main_iteration()

                  ok, error = wifi_connect(ssid, password)

                  if ok:
                      break

                  entry.set_sensitive(True)
                  connect_button.set_sensitive(True)

                  status.set_markup(
                      "<span foreground='red'>{}</span>".format(
                          GLib.markup_escape_text(error or "Failed to connect.")
                      )
                  )

              dialog.destroy()

          def show_volume(
              self,
              button
          ):
              win = self.new_status_window(button)

              box = Gtk.Box(
                  orientation=Gtk.Orientation.VERTICAL,
                  spacing=10
              )
              box.set_border_width(14)

              title = Gtk.Label()
              title.set_markup("<b>Sound</b>")
              title.set_xalign(0)

              scale = Gtk.Scale.new_with_range(
                  Gtk.Orientation.HORIZONTAL,
                  0,
                  100,
                  1
              )

              raw = command([
                  "pactl",
                  "get-sink-volume",
                  "@DEFAULT_SINK@"
              ])

              volume = 50

              for token in raw.split():
                  if token.endswith("%"):
                      try:
                          volume = int(token[:-1])
                          break
                      except ValueError:
                          pass

              scale.set_value(volume)
              scale.set_size_request(210, -1)

              value_label = Gtk.Label(
                  label=f"{volume}%"
              )
              value_label.set_xalign(0)

              def volume_changed(widget):
                  value = int(widget.get_value())
                  value_label.set_text(f"{value}%")

                  subprocess.Popen([
                      "pactl",
                      "set-sink-volume",
                      "@DEFAULT_SINK@",
                      f"{value}%"
                  ])

              scale.connect(
                  "value-changed",
                  volume_changed
              )

              box.pack_start(
                  title,
                  False,
                  False,
                  0
              )
              box.pack_start(
                  scale,
                  False,
                  False,
                  0
              )
              box.pack_start(
                  value_label,
                  False,
                  False,
                  0
              )

              win.add(box)
              self.show_status_popup(win, button)

