          def on_start_menu_deactivate(self, _menu):
              # GtkMenuShell's own signal for "I've just been dismissed" -
              # fired for a real outside click, Escape, or an item being
              # activated. Only used here to debounce the Start button
              # reopening the menu on the same click that just closed it.
              self.start_menu_closed_at = GLib.get_monotonic_time()

          def toggle_start_menu(self, *_):
              if self.start_menu.get_visible():
                  self.start_menu.popdown()
                  return

              closed_at = getattr(self, "start_menu_closed_at", 0)
              if GLib.get_monotonic_time() - closed_at < 250000:
                  return

              self.create_start_menu()

              self.start_menu.popup_at_widget(
                  self.start_button,
                  Gdk.Gravity.NORTH_WEST,
                  Gdk.Gravity.SOUTH_WEST,
                  None
              )

          def launch_and_hide(
              self,
              command_line
          ):
              self.start_menu.popdown()
              spawn(command_line)

          def new_status_window(self, button):
              # A real Gtk.Popover, not a plain Gtk.Window. The same lesson
              # from the Start Menu applies here: a custom keep_above window
              # dismissed via focus-out-event turned out unreliable in this
              # environment (it could fail to fire at all for a genuine
              # outside click, leaving the popup stuck open). Popover has
              # its own well-tested grab that dismisses on an actual outside
              # click, the same class of mechanism Gtk.Menu uses, without
              # depending on window-manager focus events. It also isn't a
              # separate top-level window Wnck's tasklist would ever see.
              return Gtk.Popover.new(button)

          def show_status_popup(self, win, _button):
              win.show_all()
              win.popup()

          def show_network(
