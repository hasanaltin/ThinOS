      #!/usr/bin/python3
      import gi
      import os
      import platform
      import subprocess

      gi.require_version("Gtk", "3.0")

      from gi.repository import Gtk, Gdk, GLib


      def command(args):
          try:
              return subprocess.check_output(
                  args,
                  text=True,
                  stderr=subprocess.DEVNULL
              ).strip()
          except Exception:
              return ""


      def os_name():
          try:
              values = {}
              with open("/etc/os-release", encoding="utf-8") as f:
                  for line in f:
                      if "=" in line:
                          k, v = line.rstrip().split("=", 1)
                          values[k] = v.strip('"')
              return values.get("PRETTY_NAME", "Ubuntu")
          except Exception:
              return "Ubuntu"


      def cpu_name():
          for line in command(["lscpu"]).splitlines():
              if line.startswith("Model name:"):
                  return line.split(":", 1)[1].strip()
          return platform.processor() or "Unknown"


      def memory_total():
          try:
              with open("/proc/meminfo", encoding="utf-8") as f:
                  for line in f:
                      if line.startswith("MemTotal:"):
                          kb = int(line.split()[1])
                          return f"{kb / 1024 / 1024:.1f} GiB"
          except Exception:
              pass
          return "Unknown"


      def network_information():
          interface = ""
          gateway = ""

          route = command(["ip", "route", "show", "default"])

          if route:
              parts = route.split()
              if "dev" in parts:
                  interface = parts[parts.index("dev") + 1]
              if "via" in parts:
                  gateway = parts[parts.index("via") + 1]

          ipv4 = ""
          mac = ""

          if interface:
              address = command(
                  ["ip", "-4", "-o", "addr", "show", "dev", interface]
              )

              if address:
                  fields = address.split()
                  if "inet" in fields:
                      ipv4 = fields[fields.index("inet") + 1].split("/")[0]

              try:
                  with open(
                      f"/sys/class/net/{interface}/address",
                      encoding="utf-8"
                  ) as f:
                      mac = f.read().strip()
              except Exception:
                  pass

          return interface, ipv4, gateway, mac


      def uptime():
          try:
              with open("/proc/uptime", encoding="utf-8") as f:
                  seconds = int(float(f.read().split()[0]))
              days, seconds = divmod(seconds, 86400)
              hours, seconds = divmod(seconds, 3600)
              minutes = seconds // 60

              parts = []
              if days:
                  parts.append(f"{days}d")
              if hours:
                  parts.append(f"{hours}h")
              parts.append(f"{minutes}m")
              return " ".join(parts)

          except Exception:
              return "Unknown"


      CARD_CSS = b"""
      .thinclient-card {
          background-color: #ffffff;
          border: 1px solid #d8d8d8;
          border-radius: 8px;
      }

      .thinclient-card row {
          border-bottom: 1px solid #ececec;
      }

      .thinclient-card row:last-child {
          border-bottom: none;
      }

      .thinclient-group-title {
          font-weight: bold;
          margin-left: 4px;
      }

      .thinclient-dim-label {
          color: #6c6c6c;
          font-size: 12px;
      }
      """


      def apply_css():
          provider = Gtk.CssProvider()
          provider.load_from_data(CARD_CSS)

          Gtk.StyleContext.add_provider_for_screen(
              Gdk.Screen.get_default(),
              provider,
              Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION
          )


      def make_group(parent_box, title):
          if title:
              title_label = Gtk.Label()

              title_label.set_markup(
                  "<b>{}</b>".format(GLib.markup_escape_text(title))
              )

              title_label.set_xalign(0)
              title_label.get_style_context().add_class("thinclient-group-title")
              parent_box.pack_start(title_label, False, False, 0)

          listbox = Gtk.ListBox()
          listbox.set_selection_mode(Gtk.SelectionMode.NONE)
          listbox.get_style_context().add_class("thinclient-card")
          parent_box.pack_start(listbox, False, False, 0)
          return listbox


      def make_row(listbox, title, subtitle=None, icon=None):
          row = Gtk.ListBoxRow()
          row.set_selectable(False)
          row.set_activatable(False)

          hbox = Gtk.Box(
              orientation=Gtk.Orientation.HORIZONTAL,
              spacing=12
          )

          hbox.set_border_width(10)

          if icon:
              image = Gtk.Image.new_from_icon_name(icon, Gtk.IconSize.BUTTON)
              image.set_pixel_size(22)
              hbox.pack_start(image, False, False, 0)

          text_box = Gtk.Box(
              orientation=Gtk.Orientation.VERTICAL,
              spacing=2
          )

          title_label = Gtk.Label(label=title)
          title_label.set_xalign(0)
          text_box.pack_start(title_label, False, False, 0)

          if subtitle is not None:
              subtitle_label = Gtk.Label(label=subtitle)
              subtitle_label.set_xalign(0)
              subtitle_label.set_line_wrap(True)

              subtitle_label.get_style_context().add_class(
                  "thinclient-dim-label"
              )

              text_box.pack_start(subtitle_label, False, False, 0)

          hbox.pack_start(text_box, True, True, 0)
          row.add(hbox)
          listbox.add(row)
          return row, hbox


      def add_row(listbox, title, value, icon):
          make_row(listbox, title, value or "Not available", icon)


      def add_window_buttons(window, header):
          # Gtk.HeaderBar shows no buttons at all unless told to, and the
          # default layout it would use (set_show_close_button) depends on a
          # gtk-decoration-layout setting this appliance doesn't configure -
          # so these are added explicitly instead of relying on a default.
          close_button = Gtk.Button.new_from_icon_name(
              "window-close-symbolic", Gtk.IconSize.BUTTON
          )
          close_button.set_tooltip_text("Close")
          close_button.connect("clicked", lambda *_: window.close())
          header.pack_end(close_button)

          maximize_button = Gtk.Button.new_from_icon_name(
              "window-maximize-symbolic", Gtk.IconSize.BUTTON
          )
          maximize_button.set_tooltip_text("Maximize")

          def toggle_maximize(_button):
              if window.is_maximized():
                  window.unmaximize()
              else:
                  window.maximize()

          maximize_button.connect("clicked", toggle_maximize)
          header.pack_end(maximize_button)

          def on_state_changed(_win, event):
              maximized = bool(
                  event.new_window_state & Gdk.WindowState.MAXIMIZED
              )

              maximize_button.set_tooltip_text(
                  "Restore" if maximized else "Maximize"
              )

              maximize_button.set_image(
                  Gtk.Image.new_from_icon_name(
                      "window-restore-symbolic"
                      if maximized
                      else "window-maximize-symbolic",
                      Gtk.IconSize.BUTTON
                  )
              )

              return False

          window.connect("window-state-event", on_state_changed)

          minimize_button = Gtk.Button.new_from_icon_name(
              "window-minimize-symbolic", Gtk.IconSize.BUTTON
          )
          minimize_button.set_tooltip_text("Minimize")
          minimize_button.connect("clicked", lambda *_: window.iconify())
          header.pack_end(minimize_button)


      class SystemInformation(Gtk.Application):

          def __init__(self):
              super().__init__(
                  application_id="com.vdi.SystemInformation"
              )

          def do_activate(self):
              apply_css()

              win = Gtk.ApplicationWindow(application=self)
              win.set_title("System Information")
              win.set_default_size(760, 650)

              root = Gtk.Box(orientation=Gtk.Orientation.VERTICAL)

              header = Gtk.HeaderBar()
              header.set_title("System Information")
              header.set_subtitle("VDI Thin Client")
              add_window_buttons(win, header)
