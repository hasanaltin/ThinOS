      cat > /usr/local/bin/thinclient-control-panel <<'PY'
      #!/usr/bin/python3

      import gi
      import os
      import re
      import subprocess
      import threading

      gi.require_version("Gtk", "4.0")
      gi.require_version("Adw", "1")

      from gi.repository import Gtk, Adw, GLib


      ADMIN_MARKERS = [
          os.path.expanduser("~/.cache/thinclient/admin-mode"),
          f"/run/user/{os.getuid()}/thinclient-admin-mode",
      ]


      def command(args):
          try:
              return subprocess.check_output(
                  args,
                  text=True,
                  stderr=subprocess.DEVNULL
              ).strip()
          except Exception:
              return ""


      def admin_enabled():
          return any(os.path.exists(x) for x in ADMIN_MARKERS)


      def network_info():
          interface = ""
          gateway = ""
          address = ""
          dns = ""

          route = command(["ip", "route", "show", "default"])

          if route:
              parts = route.split()
              if "dev" in parts:
                  interface = parts[parts.index("dev") + 1]
              if "via" in parts:
                  gateway = parts[parts.index("via") + 1]

          if interface:
              raw = command([
                  "ip",
                  "-4",
                  "-o",
                  "addr",
                  "show",
                  "dev",
                  interface
              ])

              match = re.search(r"\binet\s+([0-9.]+)/", raw)
              if match:
                  address = match.group(1)

          resolvectl = command(["resolvectl", "dns"])

          if resolvectl:
              lines = [
                  x.strip()
                  for x in resolvectl.splitlines()
                  if interface and interface in x
              ]
              if lines:
                  dns = lines[0].split(":", 1)[-1].strip()

          return interface, address, gateway, dns


      def nmcli_split(line):
          # nmcli -t escapes literal ":" inside a field as "\:"; split only on
          # unescaped colons so an SSID containing ":" isn't cut in half.
          parts = re.split(r"(?<!\\):", line)
          return [p.replace("\\:", ":") for p in parts]


      def wifi_device():
          out = command(["nmcli", "-t", "-f", "DEVICE,TYPE", "device"])

          for line in out.splitlines():
              fields = nmcli_split(line)
              if len(fields) == 2 and fields[1] == "wifi":
                  return fields[0]

          return ""


      def wifi_scan():
          device = wifi_device()
          if not device:
              return None

          subprocess.run(
              ["nmcli", "device", "wifi", "rescan", "ifname", device],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              timeout=15
          )

          out = command([
              "nmcli", "-t", "-f", "IN-USE,SSID,SIGNAL,SECURITY",
              "device", "wifi", "list", "ifname", device
          ])

          seen = set()
          networks = []

          for line in out.splitlines():
              fields = nmcli_split(line)
              if len(fields) < 4:
                  continue

              in_use, ssid, signal = fields[0], fields[1], fields[2]
              security = ":".join(fields[3:])

              if not ssid or ssid in seen:
                  continue
              seen.add(ssid)

              networks.append({
                  "ssid": ssid,
                  "signal": int(signal) if signal.isdigit() else 0,
                  "secured": bool(security.strip()) and security.strip() != "--",
                  "in_use": in_use == "*",
              })

          networks.sort(key=lambda n: (-n["in_use"], -n["signal"]))
          return networks


      def display_info():
          raw = command(["xrandr", "--current"])
          connected = []

          for line in raw.splitlines():
              if " connected" not in line:
                  continue

              name = line.split()[0]
              resolution = ""

              match = re.search(r"(\d+x\d+)\+\d+\+\d+", line)
              if match:
                  resolution = match.group(1)

              connected.append((name, resolution or "Connected"))

          return connected


      def keyboard_info():
          raw = command(["setxkbmap", "-query"])
          layout = "us"
          variant = ""

          for line in raw.splitlines():
              if line.startswith("layout:"):
                  layout = line.split(":", 1)[1].strip()
              elif line.startswith("variant:"):
                  variant = line.split(":", 1)[1].strip()

          return layout, variant


      def volume_percent():
          raw = command([
              "pactl",
              "get-sink-volume",
              "@DEFAULT_SINK@"
          ])

          for token in raw.split():
              if token.endswith("%"):
                  try:
                      return int(token[:-1])
                  except ValueError:
                      pass

          return 50


      def add_arrow(row):
          image = Gtk.Image.new_from_icon_name("go-next-symbolic")
          image.set_pixel_size(16)
          row.add_suffix(image)


      def add_icon(row, icon):
          image = Gtk.Image.new_from_icon_name(icon)
          image.set_pixel_size(22)
          row.add_prefix(image)


      class ControlCenter(Adw.Application):

          def __init__(self):
              super().__init__(
