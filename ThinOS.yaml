      #!/usr/bin/python3
      import configparser, gi, os, re, shlex, shutil, subprocess, sys
      gi.require_version("Gtk", "3.0")
      from gi.repository import Gtk
      
      def error(message):
          d = Gtk.MessageDialog(modal=True, message_type=Gtk.MessageType.ERROR, buttons=Gtk.ButtonsType.OK, text=message)
          d.run(); d.destroy()
      
      def load_desktop(path):
          c = configparser.ConfigParser(interpolation=None); c.optionxform = str; c.read(path)
          if not c.has_section("Desktop Entry"):
              raise RuntimeError("Invalid connection shortcut.")
          return c
      
      def get_profile(config):
          args = shlex.split(config["Desktop Entry"].get("Exec", ""))
          if len(args) < 2 or args[0] != "/usr/local/bin/thinclient-rdp-profile":
              raise RuntimeError("This is not a Thin Client RDP connection.")
          return args[1]
      
      def mark_trusted(path):
          subprocess.run(["/usr/bin/gio", "set", "-t", "string", path, "metadata::trusted", "true"],
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
      
      def save_desktop(config, path):
          with open(path, "w", encoding="utf-8") as f:
              config.write(f, space_around_delimiters=False)
          os.chmod(path, 0o755); mark_trusted(path)
      
      def safe_name(value):
          return re.sub(r"[^A-Za-z0-9._-]+", "-", value).strip("-._") or "Connection"
      
      def unique_path(path):
          if not os.path.exists(path): return path
          root, ext = os.path.splitext(path); n = 2
          while True:
              candidate = f"{root}-{n}{ext}"
              if not os.path.exists(candidate): return candidate
              n += 1
      
      def start_connection(desktop):
          c = load_desktop(desktop); subprocess.Popen(["/usr/local/bin/thinclient-rdp-profile", get_profile(c)], start_new_session=True)
      
      def edit_connection(desktop):
          c = load_desktop(desktop); subprocess.Popen(["/usr/local/bin/thinclient-rdp", "--edit", get_profile(c)], start_new_session=True)
      
      def copy_connection(desktop):
          c = load_desktop(desktop); e = c["Desktop Entry"]; profile = get_profile(c)
          stem = os.path.splitext(os.path.basename(profile))[0]
          new_profile = unique_path(os.path.join(os.path.dirname(profile), stem + "-copy.json"))
          shutil.copy2(profile, new_profile); os.chmod(new_profile, 0o600)
          new_name = e.get("Name", "Remote Desktop") + " Copy"
          new_desktop = unique_path(os.path.join(os.path.dirname(desktop), "RDP-" + safe_name(new_name) + ".desktop"))
          e["Name"] = new_name; e["Exec"] = "/usr/local/bin/thinclient-rdp-profile " + new_profile
          save_desktop(c, new_desktop)
      
      def rename_connection(desktop):
          c = load_desktop(desktop); e = c["Desktop Entry"]; current = e.get("Name", "Remote Desktop")
          d = Gtk.Dialog(title="Rename Connection", flags=Gtk.DialogFlags.MODAL)
          d.add_button("Cancel", Gtk.ResponseType.CANCEL); d.add_button("Rename", Gtk.ResponseType.OK)
          box = d.get_content_area(); box.set_border_width(18); box.set_spacing(12)
          label = Gtk.Label(label="Connection Name"); label.set_halign(Gtk.Align.START)
          entry = Gtk.Entry(); entry.set_text(current); entry.set_activates_default(True)
          box.pack_start(label, False, False, 0); box.pack_start(entry, False, False, 0)
          d.set_default_response(Gtk.ResponseType.OK); d.show_all(); response = d.run(); new_name = entry.get_text().strip(); d.destroy()
          if response != Gtk.ResponseType.OK or not new_name: return
          new_path = os.path.join(os.path.dirname(desktop), "RDP-" + safe_name(new_name) + ".desktop")
          if os.path.abspath(new_path) != os.path.abspath(desktop) and os.path.exists(new_path):
              error("A connection with this name already exists."); return
          e["Name"] = new_name
          if os.path.abspath(new_path) != os.path.abspath(desktop):
              os.rename(desktop, new_path)
              desktop = new_path
          save_desktop(c, desktop)
      
      def delete_connection(desktop):
          c = load_desktop(desktop); profile = get_profile(c); name = c["Desktop Entry"].get("Name", "Remote Desktop")
          d = Gtk.MessageDialog(modal=True, message_type=Gtk.MessageType.QUESTION, buttons=Gtk.ButtonsType.YES_NO,
                                text=f"Delete '{name}'?")
          d.format_secondary_text("The saved Remote Desktop connection will be removed.")
          response = d.run(); d.destroy()
          if response != Gtk.ResponseType.YES: return
          for path in (desktop, profile):
              try: os.remove(path)
              except FileNotFoundError: pass
      
      if len(sys.argv) != 3:
          raise SystemExit(1)
      cmd, desktop = sys.argv[1], os.path.abspath(sys.argv[2])
      try:
          {"start": start_connection, "edit": edit_connection, "copy": copy_connection,
           "rename": rename_connection, "delete": delete_connection}[cmd](desktop)
      except Exception as exc:
          error(str(exc))
