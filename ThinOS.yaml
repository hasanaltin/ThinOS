                  False,
                  0
              )

              self.tasks = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=2
              )

              root.pack_start(
                  self.tasks,
                  True,
                  True,
                  8
              )

              status = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=0
              )

              root.pack_end(
                  status,
                  False,
                  False,
                  3
              )

              self.keyboard_button = self.status_button(
                  "input-keyboard-symbolic",
                  self.show_keyboard,
                  "Keyboard"
              )

              self.network_button = self.status_button(
                  "network-wired-symbolic",
                  self.show_network,
                  "Network"
              )

              self.volume_button = self.status_button(
                  "audio-volume-high-symbolic",
                  self.show_volume,
                  "Volume"
              )

              status.pack_start(
                  self.keyboard_button,
                  False,
                  False,
                  0
              )

              status.pack_start(
                  self.network_button,
                  False,
                  False,
                  0
              )

              status.pack_start(
                  self.volume_button,
                  False,
                  False,
                  0
              )

              self.clock_button = Gtk.Button()
              self.clock_button.set_name("ClockButton")
              self.clock_button.set_relief(
                  Gtk.ReliefStyle.NONE
              )

              self.clock_button.connect(
                  "clicked",
                  self.show_calendar
              )

              clock_box = Gtk.Box(
                  orientation=Gtk.Orientation.VERTICAL,
                  spacing=0
              )

              self.clock_time = Gtk.Label()
              self.clock_time.set_name("ClockTime")

              self.clock_date = Gtk.Label()
              self.clock_date.set_name("ClockDate")

              clock_box.pack_start(
                  self.clock_time,
