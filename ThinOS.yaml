#cloud-config
# Ubuntu 24.04 LTS VDI Thin Client - current enterprise shell build
#
# Local administrator:
#   username: vdi
#   password: set your own hash below (identity.password) before building.
#             This file is public - never commit a real password hash here.
#             Generate one with:  mkpasswd -m sha-512    (or: openssl passwd -6)
#
# End-user session:
#   LightDM -> hidden kiosk autologin -> Openbox + Nemo thin-client desktop
#
# Desktop empty-space right-click (Ubuntu 24.04 / Nemo 6.0.2):
#   Create > Citrix / RDP / Omnissa Horizon
#   Arrange > By Name / By Type / By Size / By Modification Date
#   Implemented by nemo-python (not actions-tree.json, which is not used here).
#
# Saved RDP shortcut right-click:
#   Start / Edit / Copy / Rename / Delete
#
# Note: Omnissa Horizon is downloaded from the URL used in the previous image.
# Citrix Workspace is not bundled because no Citrix package URL was supplied.
# UI: custom VDI shell, libadwaita System Information / Control Center /
# Administrator Login, single Openbox workspace, no Start-menu Search bar, graphical Administrator Tools,
# and a built-in enterprise-style wallpaper.

autoinstall:
  version: 1

  interactive-sections:
    - storage

  refresh-installer:
    update: false

  locale: en_US.UTF-8

  keyboard:
    layout: us

  timezone: Europe/Belgrade

  identity:
    realname: VDI Administrator
    hostname: horizon-thinclient
    username: vdi
    # Placeholder only - this is not a usable hash, so the account is locked
    # out until you replace it. Generate your own with `mkpasswd -m sha-512`
    # and paste the result here before building. Never commit a real hash to
    # this public repository.
    password: 'CHANGEME-generate-your-own-sha512-crypt-hash'

  source:
    id: ubuntu-desktop-minimal

  drivers:
    install: false

  oem:
    install: false

  codecs:
    install: false

  # Install the base OS from the ISO. The thin-client desktop packages are
  # installed by the first-boot service after networking is available.
  apt:
    preserve_sources_list: false
    geoip: false
    mirror-selection:
      primary:
        - uri: "http://127.0.0.1:9/ubuntu"
          arches:
            - amd64
    fallback: offline-install

  late-commands:
    # Restore normal repositories for the installed system.
    - |
      mkdir -p /target/etc/apt/sources.list.d
      cat > /target/etc/apt/sources.list.d/ubuntu.sources <<'EOF'
      Types: deb
      URIs: https://archive.ubuntu.com/ubuntu
      Suites: noble noble-updates noble-backports
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

      Types: deb
      URIs: https://security.ubuntu.com/ubuntu
      Suites: noble-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      EOF

    - |
      mkdir -p /target/etc/apt/apt.conf.d
      cat > /target/etc/apt/apt.conf.d/99-thinclient-network <<'EOF'
      Acquire::ForceIPv4 "true";
      Acquire::Retries "5";
      Acquire::http::Timeout "30";
      Acquire::https::Timeout "30";
      EOF


    # Install the full thin-client provisioning script into the target.
    - |
      cat > /target/usr/local/sbin/thinclient-firstboot <<'THINCLIENT_FIRSTBOOT'
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      
      MARKER=/var/lib/thinclient/configured
      if [ -e "$MARKER" ]; then
          exit 0
      fi
      
      mkdir -p /var/lib/thinclient
      
      # Keep a persistent provisioning log. If provisioning fails, the stock
      # Ubuntu graphical login remains available for administrator recovery.
      exec > >(tee -a /var/log/thinclient-firstboot.log) 2>&1
      FAILED=/var/lib/thinclient/last-error
      trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "Thin Client provisioning failed at line %s (exit %s).\nSee /var/log/thinclient-firstboot.log\n" "$LINENO" "$rc" > "$FAILED"; fi' EXIT
      rm -f "$FAILED"

      # Wait up to three minutes for DNS/networking. Do not loop forever: a
      # failed first boot must fall back to the normal Ubuntu graphical login.
      NETWORK_READY=0
      for _ in $(seq 1 36); do
          if getent hosts archive.ubuntu.com >/dev/null 2>&1; then
              NETWORK_READY=1
              break
          fi
          sleep 5
      done
      if [ "$NETWORK_READY" -ne 1 ]; then
          echo 'Network/DNS did not become ready; leaving Ubuntu recovery desktop enabled.' >&2
          exit 20
      fi

      apt-get update
      apt-get install -y --no-install-recommends \
          lightdm slick-greeter \
          xserver-xorg xserver-xorg-core xserver-xorg-input-libinput \
          openbox \
          nemo nemo-python \
          cinnamon-desktop-data librsvg2-common \
          python3 python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-wnck-3.0 \
          freerdp3-x11 \
          network-manager network-manager-gnome \
          pavucontrol arandr lxinput pulseaudio-utils \
          lxpolkit \
          zenity pamtester wmctrl \
          gnome-terminal gnome-text-editor gnome-system-monitor gnome-logs gnome-screenshot update-manager \
          x11-xserver-utils x11-utils xinput dbus-x11 dconf-cli \
          xdg-user-dirs curl ca-certificates openssh-server

      # Installing LightDM must not take away the working Ubuntu recovery GUI
      # until every appliance component has passed validation.
      if [ -f /lib/systemd/system/gdm3.service ]; then
          ln -sf /lib/systemd/system/gdm3.service /etc/systemd/system/display-manager.service
          systemctl enable gdm3.service 2>/dev/null || true
      fi

      # Local administrator already exists from autoinstall identity. Ensure
      # the hidden kiosk account exists for the appliance session.
      if ! id kiosk >/dev/null 2>&1; then
          useradd -m -s /bin/bash kiosk
      fi
      passwd -l kiosk || true
      mkdir -p \
          /home/kiosk/Desktop \
          /home/kiosk/.config/nemo \
          /home/kiosk/.config/thinclient \
          /home/kiosk/.config/gtk-4.0 \
          /home/kiosk/.cache/thinclient \
          /home/kiosk/.local/share/nemo/actions \
          /home/kiosk/.local/share/nemo-python/extensions

      runuser -u kiosk -- xdg-user-dirs-update --set DESKTOP /home/kiosk/Desktop 2>/dev/null || true

      # Openbox runs with no compositor (deliberately - see thinclient-session),
      # so GTK4/libadwaita's client-side decoration shadow, an alpha-blended
      # region around every window, doesn't get proper double buffering.
      # Reported as visible flicker specifically when two or more of these
      # apps (Control Panel, System Information, Administrator Login) are
      # open together and the active window changes. Dropping the shadow
      # removes the alpha blending that needs a compositor to redraw cleanly;
      # GTK4 auto-loads this file for every app for this user, so it covers
      # all of them without touching each app's own code.
      cat > /home/kiosk/.config/gtk-4.0/gtk.css <<'EOF'
      decoration {
          box-shadow: none;
          margin: 0;
      }

      window.background {
          box-shadow: none;
      }
      EOF

      # Enterprise-style wallpaper shipped with the appliance. It is a simple
      # original SVG so the installation has no external wallpaper dependency.
      mkdir -p /usr/local/share/thinclient
      cat > /usr/local/share/thinclient/wallpaper.svg <<'EOF'
      <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#14364d"/>
            <stop offset="0.55" stop-color="#1f5b7a"/>
            <stop offset="1" stop-color="#2f7fa3"/>
          </linearGradient>
          <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2f6f8f" stop-opacity="0.78"/>
            <stop offset="1" stop-color="#4f9bb7" stop-opacity="0.58"/>
          </linearGradient>
          <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#17435f" stop-opacity="0.72"/>
            <stop offset="1" stop-color="#2a6685" stop-opacity="0.58"/>
          </linearGradient>
        </defs>
        <rect width="1920" height="1080" fill="url(#bg)"/>
        <path d="M0 210 C330 80 540 360 860 260 C1160 165 1430 15 1920 95 L1920 0 L0 0 Z" fill="#0f2f43" opacity="0.33"/>
        <path d="M0 590 C310 520 520 760 790 645 C1085 520 1390 540 1920 300 L1920 720 C1510 840 1210 760 915 865 C590 980 315 805 0 915 Z" fill="url(#wave2)"/>
        <path d="M0 805 C310 680 500 955 820 865 C1160 770 1460 650 1920 565 L1920 1080 L0 1080 Z" fill="url(#wave1)"/>
      </svg>
      EOF
      chmod 644 /usr/local/share/thinclient/wallpaper.svg

      # Stiloetto (light) GTK3 theme, vendored from
      # https://github.com/lassekongo83/stilo-themes (GPL-3.0). Installed as
      # plain files rather than built from source: the upstream build only
      # runs sassc over its .scss sources, and this repo already ships that
      # compiled gtk.css plus the icon/scrollbar assets it references, so
      # there is nothing left to compile and no meson/ninja/sassc build
      # dependency to add just for a theme.
      mkdir -p /usr/share/themes/Stiloetto/gtk-3.0/assets
      cat > /usr/share/themes/Stiloetto/index.theme <<'THINCLIENT_STILOETTO_INDEX'
      [X-GNOME-Metatheme]
      Name=Stiloetto
      Type=X-GNOME-Metatheme
      Comment=Stiloetto theme
      Encoding=UTF-8
      GtkTheme=Stiloetto
      THINCLIENT_STILOETTO_INDEX
      cat > /usr/share/themes/Stiloetto/gtk-3.0/gtk.css <<'THINCLIENT_STILOETTO_CSS'
      * { padding: 0; -GtkToolButton-icon-spacing: 4; -GtkTextView-error-underline-color: #cc0000; -GtkScrolledWindow-scrollbar-spacing: 0; -GtkToolItemGroup-expander-size: 11; -GtkWidget-text-handle-width: 20; -GtkWidget-text-handle-height: 24; -GtkDialog-button-spacing: 4; -GtkDialog-action-area-border: 0; outline-color: alpha(currentColor,0.3); outline-style: dashed; outline-offset: -3px; outline-width: 1px; -gtk-outline-radius: 1px; -gtk-secondary-caret-color: #3665b3; }

      .background { color: #3C3C3C; background-color: #e2e2e3; }

      .background:backdrop { color: #6e6e6e; background-color: #e2e2e3; text-shadow: none; -gtk-icon-shadow: none; }

      *:disabled { -gtk-icon-effect: dim; }

      .gtkstyle-fallback { color: #3C3C3C; background-color: #e2e2e3; }

      .gtkstyle-fallback:hover { color: #3C3C3C; background-color: #fcfcfc; }

      .gtkstyle-fallback:active { color: #3C3C3C; background-color: #c8c8ca; }

      .gtkstyle-fallback:disabled { color: #7e7e7f; background-color: #d1d1d2; }

      .gtkstyle-fallback:selected { color: #ffffff; background-color: #3665b3; }

      .view, iconview, .nautilus-window notebook, .nautilus-window notebook > stack:not(:only-child) searchbar, .view text, iconview text, textview text { color: black; background-color: #ffffff; }

      .view:hover, iconview:hover, .view:backdrop:hover, .nautilus-window notebook:hover, .nautilus-window notebook > stack:not(:only-child) searchbar:hover, .view text:hover, iconview text:hover, textview text:hover { background-color: #f0f0f0; }

      .view:backdrop, iconview:backdrop, .nautilus-window notebook:backdrop, .nautilus-window notebook > stack:not(:only-child) searchbar:backdrop, .view text:backdrop, iconview text:backdrop, textview text:backdrop { color: #333333; background-color: #ffffff; }

      .view:backdrop:disabled, iconview:backdrop:disabled, .nautilus-window notebook:backdrop:disabled, .nautilus-window notebook > stack:not(:only-child) searchbar:backdrop:disabled, .view text:backdrop:disabled, iconview text:backdrop:disabled, textview text:backdrop:disabled { color: #bbbbbd; }

      .view:disabled, iconview:disabled, .nautilus-window notebook:disabled, .nautilus-window notebook > stack:not(:only-child) searchbar:disabled, .view text:disabled, iconview text:disabled, textview text:disabled { color: #7e7e7f; background-color: #d1d1d2; }

      textview border { background-color: #f1f1f1; }

      .rubberband, rubberband, XfdesktopIconView.view .rubberband, .content-view rubberband, .content-view .rubberband, treeview.view rubberband, flowbox rubberband { border: 1px solid #2a4f8c; background-color: rgba(42, 79, 140, 0.2); }

      flowbox flowboxchild { padding: 3px; }

      flowbox flowboxchild:selected { outline-offset: -2px; }

      .content-view .tile { margin: 2px; background-color: transparent; border-radius: 0; padding: 0; }

      .content-view .tile:backdrop { background-color: transparent; }

      .content-view .tile:active, .content-view .tile:selected { background-color: transparent; }

      .content-view .tile:disabled { background-color: transparent; }

      label { caret-color: currentColor; }

      label selection { background-color: #3665b3; color: #ffffff; }

      label:disabled { color: #7e7e7f; }

      button label:disabled { color: inherit; }

      label:disabled:backdrop { color: #bbbbbd; }

      button label:disabled:backdrop { color: inherit; }

      label.error { color: #cc0000; }

      label.error:disabled { color: rgba(204, 0, 0, 0.5); }

      label.error:disabled:backdrop { color: rgba(204, 0, 0, 0.4); }

      .dim-label, .titlebar:not(headerbar) .subtitle, headerbar .subtitle, label.separator { opacity: 0.55; text-shadow: none; }

      assistant .sidebar { background-color: #ffffff; border-top: 1px solid #bbbbbd; }

      assistant .sidebar:backdrop { background-color: #ffffff; border-color: #c3c3c5; }

      assistant.csd .sidebar { border-top-style: none; }

      assistant .sidebar label { padding: 6px 12px; }

      assistant .sidebar label.highlight { background-color: #c1c1c2; }

      .osd .scale-popup, .app-notification, .app-notification.frame, .csd popover.background.osd, popover.background.osd, .csd popover.background.touch-selection, .csd popover.background.magnifier, popover.background.touch-selection, popover.background.magnifier, .osd { color: #f6f6f7; border: none; background-color: rgba(35, 35, 35, 0.7); background-clip: padding-box; text-shadow: 0 1px black; -gtk-icon-shadow: 0 1px black; }

      .osd .scale-popup:backdrop, .app-notification:backdrop, popover.background.osd:backdrop, popover.background.touch-selection:backdrop, popover.background.magnifier:backdrop, .osd:backdrop { text-shadow: none; -gtk-icon-shadow: none; }

      @keyframes spin { to { -gtk-icon-transform: rotate(1turn); } }

      spinner { background: none; opacity: 0; -gtk-icon-source: -gtk-icontheme("process-working-symbolic"); }

      spinner:backdrop { color: #6e6e6e; }

      spinner:checked { opacity: 1; animation: spin 1s linear infinite; }

      spinner:checked:disabled { opacity: 0.5; }

      .large-title { font-weight: 300; font-size: 24pt; }

      .title-1 { font-weight: 800; font-size: 20pt; }

      .title-2 { font-weight: 800; font-size: 15pt; }

      .title-3 { font-weight: 700; font-size: 15pt; }

      .title-4 { font-weight: 700; font-size: 13pt; }

      .heading { font-weight: 700; font-size: 11pt; }

      .body { font-weight: 400; font-size: 11pt; }

      .caption-heading { font-weight: 700; font-size: 9pt; }

      .caption { font-weight: 400; font-size: 9pt; }

      spinbutton:not(.vertical), entry { min-height: 24px; padding-left: 8px; padding-right: 8px; border: 1px solid; border-radius: 2px; transition: all 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94); color: black; border-color: transparent; background-color: #ffffff; box-shadow: inset 0 0 0 1px rgba(54, 101, 179, 0), 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 1px rgba(0, 0, 0, 0.16); }

      spinbutton:not(.vertical) image.left, entry image.left { margin-right: 6px; }

      spinbutton:not(.vertical) image.right, entry image.right { margin-left: 6px; }

      spinbutton.flat:not(.vertical), entry.flat:focus, entry.flat:backdrop, entry.flat:disabled, entry.flat { min-height: 0; padding: 2px; background-color: transparent; border-color: transparent; border-radius: 0; }

      spinbutton:focus:not(.vertical), entry:focus { box-shadow: inset 0 0 0 1px #3665b3; border-color: #3665b3; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.4); }

      spinbutton:disabled:not(.vertical), entry:disabled { color: #7e7e7f; border-color: transparent; background-color: #d1d1d2; box-shadow: none; }

      spinbutton.error:not(.vertical), entry.error { color: #cc0000; border-color: #cc0000; }

      spinbutton.error:focus:not(.vertical), entry.error:focus { box-shadow: inset 0 0 0 1px #cc0000; border-color: #3665b3; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.4); }

      spinbutton.error:not(.vertical) selection, entry.error selection { background-color: #cc0000; }

      spinbutton.warning:not(.vertical), entry.warning { color: #f57900; border-color: #f57900; }

      spinbutton.warning:focus:not(.vertical), entry.warning:focus { box-shadow: inset 0 0 0 1px #f57900; border-color: #3665b3; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.4); }

      spinbutton.warning:not(.vertical) selection, entry.warning selection { background-color: #f57900; }

      spinbutton:not(.vertical) image, entry image { color: #636363; }

      spinbutton:not(.vertical) image:hover, entry image:hover { color: #3C3C3C; }

      spinbutton:not(.vertical) image:active, entry image:active { color: #3665b3; }

      spinbutton:drop(active):not(.vertical), entry:drop(active):focus, entry:drop(active) { border-color: #4e9a06; box-shadow: inset 0 0 0 1px #4e9a06; }

      .osd spinbutton:not(.vertical), .osd entry { color: white; border-color: rgba(0, 0, 0, 0.7); background-color: rgba(0, 0, 0, 0.5); background-clip: padding-box; box-shadow: none; text-shadow: 0 1px black; -gtk-icon-shadow: 0 1px black; }

      .osd spinbutton:focus:not(.vertical), .osd entry:focus { color: white; border-color: #3665b3; background-color: rgba(0, 0, 0, 0.5); background-clip: padding-box; box-shadow: inset 0 0 0 1px #3665b3; text-shadow: 0 1px black; -gtk-icon-shadow: 0 1px black; }

      .osd spinbutton:disabled:not(.vertical), .osd entry:disabled { color: #8d8d8d; border-color: rgba(0, 0, 0, 0.7); background-color: rgba(56, 56, 56, 0.5); background-clip: padding-box; box-shadow: none; text-shadow: none; -gtk-icon-shadow: none; }

      spinbutton:not(.vertical) progress, entry progress { margin: 2px -6px; background-color: transparent; background-image: none; border-radius: 0; border-width: 0 0 2px; border-color: #3665b3; border-style: solid; box-shadow: none; }

      spinbutton:not(.vertical) progress:backdrop, entry progress:backdrop { background-color: transparent; }

      .linked:not(.vertical) > spinbutton:focus:not(.vertical) + spinbutton:not(.vertical), .linked:not(.vertical) > spinbutton:focus:not(.vertical) + button, .linked:not(.vertical) > spinbutton:focus:not(.vertical) + combobox > box > button.combo, .linked:not(.vertical) > spinbutton:focus:not(.vertical) + entry, .linked:not(.vertical) > entry:focus + button, .linked:not(.vertical) > entry:focus + combobox > box > button.combo, .linked:not(.vertical) > entry:focus + spinbutton:not(.vertical), .linked:not(.vertical) > entry:focus + entry { border-left-color: #3665b3; }

      .linked:not(.vertical) > spinbutton:focus.error:not(.vertical) + spinbutton:not(.vertical), .linked:not(.vertical) > spinbutton:focus.error:not(.vertical) + button, .linked:not(.vertical) > spinbutton:focus.error:not(.vertical) + combobox > box > button.combo, .linked:not(.vertical) > spinbutton:focus.error:not(.vertical) + entry, .linked:not(.vertical) > entry:focus.error + button, .linked:not(.vertical) > entry:focus.error + combobox > box > button.combo, .linked:not(.vertical) > entry:focus.error + spinbutton:not(.vertical), .linked:not(.vertical) > entry:focus.error + entry { border-left-color: #cc0000; }

      .linked:not(.vertical) > spinbutton:drop(active):not(.vertical) + spinbutton:not(.vertical), .linked:not(.vertical) > spinbutton:drop(active):not(.vertical) + button, .linked:not(.vertical) > spinbutton:drop(active):not(.vertical) + combobox > box > button.combo, .linked:not(.vertical) > spinbutton:drop(active):not(.vertical) + entry, .linked:not(.vertical) > entry:drop(active) + button, .linked:not(.vertical) > entry:drop(active) + combobox > box > button.combo, .linked:not(.vertical) > entry:drop(active) + spinbutton:not(.vertical), .linked:not(.vertical) > entry:drop(active) + entry { border-left-color: #4e9a06; }

      .linked.vertical > spinbutton:not(:disabled):not(.vertical) + entry:not(:disabled), .linked.vertical > spinbutton:not(:disabled):not(.vertical) + spinbutton:not(:disabled):not(.vertical), .linked.vertical > entry:not(:disabled) + entry:not(:disabled), .linked.vertical > entry:not(:disabled) + spinbutton:not(:disabled):not(.vertical) { border-top-color: #ebebeb; }

      .linked.vertical > spinbutton:disabled:not(.vertical) + spinbutton:disabled:not(.vertical), .linked.vertical > spinbutton:disabled:not(.vertical) + entry:disabled, .linked.vertical > entry:disabled + spinbutton:disabled:not(.vertical), .linked.vertical > entry:disabled + entry:disabled { border-top-color: #ebebeb; }

      .linked.vertical > spinbutton:not(.vertical) + spinbutton:focus:not(:only-child):not(.vertical), .linked.vertical > spinbutton:not(.vertical) + entry:focus:not(:only-child), .linked.vertical > entry + spinbutton:focus:not(:only-child):not(.vertical), .linked.vertical > entry + entry:focus:not(:only-child) { border-top-color: #3665b3; }

      .linked.vertical > spinbutton:not(.vertical) + spinbutton:focus.error:not(:only-child):not(.vertical), .linked.vertical > spinbutton:not(.vertical) + entry:focus.error:not(:only-child), .linked.vertical > entry + spinbutton:focus.error:not(:only-child):not(.vertical), .linked.vertical > entry + entry:focus.error:not(:only-child) { border-top-color: #cc0000; }

      .linked.vertical > spinbutton:not(.vertical) + spinbutton:drop(active):not(:only-child):not(.vertical), .linked.vertical > spinbutton:not(.vertical) + entry:drop(active):not(:only-child), .linked.vertical > entry + spinbutton:drop(active):not(:only-child):not(.vertical), .linked.vertical > entry + entry:drop(active):not(:only-child) { border-top-color: #4e9a06; }

      .linked.vertical > spinbutton:focus:not(:only-child):not(.vertical) + spinbutton:not(.vertical), .linked.vertical > spinbutton:focus:not(:only-child):not(.vertical) + entry, .linked.vertical > spinbutton:focus:not(:only-child):not(.vertical) + button, .linked.vertical > spinbutton:focus:not(:only-child):not(.vertical) + combobox > box > button.combo, .linked.vertical > entry:focus:not(:only-child) + spinbutton:not(.vertical), .linked.vertical > entry:focus:not(:only-child) + entry, .linked.vertical > entry:focus:not(:only-child) + button, .linked.vertical > entry:focus:not(:only-child) + combobox > box > button.combo { border-top-color: #3665b3; }

      .linked.vertical > spinbutton:focus.error:not(:only-child):not(.vertical) + spinbutton:not(.vertical), .linked.vertical > spinbutton:focus.error:not(:only-child):not(.vertical) + entry, .linked.vertical > spinbutton:focus.error:not(:only-child):not(.vertical) + button, .linked.vertical > spinbutton:focus.error:not(:only-child):not(.vertical) + combobox > box > button.combo, .linked.vertical > entry:focus.error:not(:only-child) + spinbutton:not(.vertical), .linked.vertical > entry:focus.error:not(:only-child) + entry, .linked.vertical > entry:focus.error:not(:only-child) + button, .linked.vertical > entry:focus.error:not(:only-child) + combobox > box > button.combo { border-top-color: #cc0000; }

