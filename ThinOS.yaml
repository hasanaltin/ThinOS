          exec /opt/Citrix/ICAClient/selfservice
      elif [ -x /opt/Citrix/ICAClient/wfica ]; then
          exec /opt/Citrix/ICAClient/wfica
      fi
      exec zenity --error --title='Citrix' --text='Citrix Workspace is not installed. Add the Citrix package to this image or install it later.'
      EOF
      chmod 755 /usr/local/bin/thinclient-citrix
      
      # RDP GUI: normal connect, --create desktop shortcut, or --edit saved profile.
      cat > /usr/local/bin/thinclient-rdp <<'PY'
      #!/usr/bin/python3
      import gi
      import json
      import os
      import re
      import subprocess
      import sys
      
      gi.require_version("Gtk", "3.0")
      from gi.repository import Gtk
      
      CONFIG_DIR = os.path.expanduser("~/.config/thinclient")
      CONFIG_FILE = os.path.join(CONFIG_DIR, "rdp.json")
      CREATE_MODE = "--create" in sys.argv
      EDIT_MODE = "--edit" in sys.argv
      EDIT_PROFILE = None
      if EDIT_MODE:
          try:
              EDIT_PROFILE = os.path.abspath(sys.argv[sys.argv.index("--edit") + 1])
          except (ValueError, IndexError):
              raise SystemExit("Missing RDP profile")
      
      DEFAULTS = {
          "computer": "", "port": "3389", "username": "", "domain": "",
          "fullscreen": True, "multimon": False, "dynamic_resolution": True,
          "resolution": "1920x1080", "scale": "100", "clipboard": True,
          "audio": True, "microphone": False, "network": "auto", "remember": True
      }
      
      def load_settings():
          data = DEFAULTS.copy()
          source = EDIT_PROFILE if EDIT_MODE and EDIT_PROFILE else CONFIG_FILE
          try:
              with open(source, "r", encoding="utf-8") as f:
                  data.update(json.load(f))
          except Exception:
              pass
          return data
      
      class RDPWindow(Gtk.Window):
          def __init__(self):
              super().__init__(title="Remote Desktop")
              self.settings = load_settings()
              self.set_default_size(620, 590)
              self.set_position(Gtk.WindowPosition.CENTER)
              self.set_resizable(False)
              self.set_border_width(24)
              self.connect("destroy", Gtk.main_quit)
      
              main = Gtk.Box(orientation=Gtk.Orientation.VERTICAL, spacing=15)
              self.add(main)
              title = Gtk.Label()
              title.set_markup("<span size='x-large' weight='bold'>Remote Desktop</span>")
              main.pack_start(title, False, False, 0)
              if EDIT_MODE:
                  subtitle_text = "Edit the saved Remote Desktop connection"
              elif CREATE_MODE:
                  subtitle_text = "Create a Remote Desktop connection on the desktop"
              else:
                  subtitle_text = "Configure and connect to a Windows computer"
              subtitle = Gtk.Label(label=subtitle_text)
              main.pack_start(subtitle, False, False, 0)
      
              notebook = Gtk.Notebook()
              main.pack_start(notebook, True, True, 5)
              notebook.append_page(self.connection_page(), Gtk.Label(label="Connection"))
              notebook.append_page(self.display_page(), Gtk.Label(label="Display"))
              notebook.append_page(self.resources_page(), Gtk.Label(label="Resources"))
              notebook.append_page(self.network_page(), Gtk.Label(label="Network"))
      
              self.status = Gtk.Label()
              self.status.set_halign(Gtk.Align.START)
              main.pack_start(self.status, False, False, 0)
              buttons = Gtk.Box(orientation=Gtk.Orientation.HORIZONTAL, spacing=12)
              cancel = Gtk.Button(label="Cancel")
              action = Gtk.Button(label="Save" if EDIT_MODE else "Create" if CREATE_MODE else "Connect")
              cancel.set_size_request(130, 42)
              action.set_size_request(130, 42)
              cancel.connect("clicked", lambda *_: Gtk.main_quit())
              if EDIT_MODE:
                  action.connect("clicked", self.save_edited_connection)
              elif CREATE_MODE:
                  action.connect("clicked", self.create_desktop_connection)
              else:
                  action.connect("clicked", self.connect_rdp)
              buttons.pack_end(action, False, False, 0)
              buttons.pack_end(cancel, False, False, 0)
              main.pack_end(buttons, False, False, 0)
              self.set_default(action)
      
          def make_grid(self):
              grid = Gtk.Grid()
              grid.set_border_width(18)
              grid.set_column_spacing(18)
              grid.set_row_spacing(14)
              return grid
      
          def add_label(self, grid, text, row):
              label = Gtk.Label(label=text)
              label.set_halign(Gtk.Align.START)
              grid.attach(label, 0, row, 1, 1)
      
          def connection_page(self):
              grid = self.make_grid()
              self.add_label(grid, "Computer", 0)
              self.computer = Gtk.Entry()
              self.computer.set_placeholder_text("Server name or IP address")
              self.computer.set_text(str(self.settings.get("computer", "")))
              self.computer.set_hexpand(True)
              grid.attach(self.computer, 1, 0, 1, 1)
      
              self.add_label(grid, "Port", 1)
              self.port = Gtk.Entry()
              self.port.set_text(str(self.settings.get("port", "3389")))
              self.port.set_max_length(5)
              grid.attach(self.port, 1, 1, 1, 1)
      
              self.add_label(grid, "Username", 2)
              self.username = Gtk.Entry()
              self.username.set_text(str(self.settings.get("username", "")))
              grid.attach(self.username, 1, 2, 1, 1)
      
              self.add_label(grid, "Domain", 3)
              self.domain = Gtk.Entry()
              self.domain.set_text(str(self.settings.get("domain", "")))
              self.domain.set_placeholder_text("Optional")
              grid.attach(self.domain, 1, 3, 1, 1)
      
              self.add_label(grid, "Password", 4)
              self.password = Gtk.Entry()
              self.password.set_visibility(False)
              self.password.set_invisible_char("●")
              self.password.set_activates_default(True)
              if CREATE_MODE or EDIT_MODE:
                  self.password.set_sensitive(False)
                  self.password.set_placeholder_text("Requested when the saved connection is opened")
              grid.attach(self.password, 1, 4, 1, 1)
      
              self.remember = Gtk.CheckButton(label="Save connection settings" if (CREATE_MODE or EDIT_MODE) else "Remember connection settings")
              self.remember.set_active(True if (CREATE_MODE or EDIT_MODE) else bool(self.settings.get("remember", True)))
              if CREATE_MODE or EDIT_MODE:
                  self.remember.set_sensitive(False)
              grid.attach(self.remember, 1, 5, 1, 1)
              note = Gtk.Label(label="The password is never saved.")
              note.set_halign(Gtk.Align.START)
              grid.attach(note, 1, 6, 1, 1)
              return grid
      
          def display_page(self):
              grid = self.make_grid()
              self.fullscreen = Gtk.CheckButton(label="Full Screen")
              self.fullscreen.set_active(bool(self.settings.get("fullscreen", True)))
              grid.attach(self.fullscreen, 0, 0, 2, 1)
              self.multimon = Gtk.CheckButton(label="Use Multiple Monitors")
              self.multimon.set_active(bool(self.settings.get("multimon", False)))
              grid.attach(self.multimon, 0, 1, 2, 1)
              self.dynamic_resolution = Gtk.CheckButton(label="Dynamic Resolution")
              self.dynamic_resolution.set_active(bool(self.settings.get("dynamic_resolution", True)))
              grid.attach(self.dynamic_resolution, 0, 2, 2, 1)
              self.add_label(grid, "Resolution", 3)
              self.resolution = Gtk.ComboBoxText()
              resolutions = ["1920x1080", "1600x900", "1366x768", "1280x720", "1024x768"]
              for value in resolutions:
                  self.resolution.append_text(value)
              try:
                  idx = resolutions.index(str(self.settings.get("resolution", "1920x1080")))
              except ValueError:
                  idx = 0
              self.resolution.set_active(idx)
              grid.attach(self.resolution, 1, 3, 1, 1)
              self.add_label(grid, "Scaling", 4)
              self.scale = Gtk.ComboBoxText()
              scales = ["100", "140", "180"]
              for value in scales:
                  self.scale.append_text(value + "%")
              try:
                  idx = scales.index(str(self.settings.get("scale", "100")))
              except ValueError:
                  idx = 0
              self.scale.set_active(idx)
              grid.attach(self.scale, 1, 4, 1, 1)
              return grid
      
          def resources_page(self):
              grid = self.make_grid()
              self.clipboard = Gtk.CheckButton(label="Enable Clipboard")
              self.clipboard.set_active(bool(self.settings.get("clipboard", True)))
              grid.attach(self.clipboard, 0, 0, 2, 1)
              self.audio = Gtk.CheckButton(label="Play Remote Audio Locally")
              self.audio.set_active(bool(self.settings.get("audio", True)))
              grid.attach(self.audio, 0, 1, 2, 1)
              self.microphone = Gtk.CheckButton(label="Redirect Microphone")
              self.microphone.set_active(bool(self.settings.get("microphone", False)))
              grid.attach(self.microphone, 0, 2, 2, 1)
              return grid
      
          def network_page(self):
              grid = self.make_grid()
              self.add_label(grid, "Connection Type", 0)
              self.network = Gtk.ComboBoxText()
              for key, label in [
                  ("auto", "Automatic"), ("lan", "LAN"), ("wan", "WAN"),
                  ("broadband-high", "Broadband - High"), ("broadband-low", "Broadband - Low")
              ]:
                  self.network.append(key, label)
              self.network.set_active_id(str(self.settings.get("network", "auto")))
              grid.attach(self.network, 1, 0, 1, 1)
              security = Gtk.Label()
              security.set_markup("<b>Certificate verification:</b> Trust On First Use")
              security.set_halign(Gtk.Align.START)
              grid.attach(security, 0, 2, 2, 1)
              return grid
      
          def validate(self):
              computer = self.computer.get_text().strip()
              port = self.port.get_text().strip() or "3389"
              if not computer:
                  self.status.set_markup("<span foreground='red'>Please enter a computer name or IP address.</span>")
                  self.computer.grab_focus()
                  return None
              try:
                  p = int(port)
                  if not 1 <= p <= 65535:
                      raise ValueError
              except ValueError:
                  self.status.set_markup("<span foreground='red'>Port must be between 1 and 65535.</span>")
                  self.port.grab_focus()
                  return None
              return computer, port
      
          def data(self, computer, port):
              return {
                  "computer": computer,
                  "port": port,
                  "username": self.username.get_text().strip(),
                  "domain": self.domain.get_text().strip(),
                  "fullscreen": self.fullscreen.get_active(),
                  "multimon": self.multimon.get_active(),
                  "dynamic_resolution": self.dynamic_resolution.get_active(),
                  "resolution": self.resolution.get_active_text(),
                  "scale": self.scale.get_active_text().replace("%", ""),
                  "clipboard": self.clipboard.get_active(),
                  "audio": self.audio.get_active(),
                  "microphone": self.microphone.get_active(),
                  "network": self.network.get_active_id(),
                  "remember": True if (CREATE_MODE or EDIT_MODE) else self.remember.get_active(),
              }
      
          def save_global(self, data):
              os.makedirs(CONFIG_DIR, mode=0o700, exist_ok=True)
              if not self.remember.get_active():
                  try:
                      os.remove(CONFIG_FILE)
                  except FileNotFoundError:
                      pass
                  return
              with open(CONFIG_FILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              os.chmod(CONFIG_FILE, 0o600)
      
          def save_edited_connection(self, _button):
              valid = self.validate()
              if not valid:
                  return
              computer, port = valid
              data = self.data(computer, port)
              with open(EDIT_PROFILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              os.chmod(EDIT_PROFILE, 0o600)
              dialog = Gtk.MessageDialog(transient_for=self, modal=True, message_type=Gtk.MessageType.INFO,
                                         buttons=Gtk.ButtonsType.OK, text="Connection settings updated.")
              dialog.run(); dialog.destroy(); Gtk.main_quit()
      
          def create_desktop_connection(self, _button):
              valid = self.validate()
              if not valid:
                  return
              computer, port = valid
              data = self.data(computer, port)
              profile_dir = os.path.join(CONFIG_DIR, "rdp-connections")
              os.makedirs(profile_dir, mode=0o700, exist_ok=True)
              slug = re.sub(r"[^A-Za-z0-9._-]+", "-", computer).strip("-._") or "remote-desktop"
              if port != "3389":
                  slug += "-" + port
              profile_file = os.path.join(profile_dir, slug + ".json")
              desktop_dir = os.path.expanduser("~/Desktop")
              os.makedirs(desktop_dir, mode=0o755, exist_ok=True)
              desktop_file = os.path.join(desktop_dir, "RDP-" + slug + ".desktop")
              if os.path.exists(profile_file) or os.path.exists(desktop_file):
                  confirm = Gtk.MessageDialog(
                      transient_for=self, modal=True, message_type=Gtk.MessageType.QUESTION,
                      buttons=Gtk.ButtonsType.YES_NO,
                      text=f"A connection to '{computer}' already exists on the desktop."
                  )
                  confirm.format_secondary_text("Replace it with these settings?")
                  response = confirm.run(); confirm.destroy()
                  if response != Gtk.ResponseType.YES:
                      return
              with open(profile_file, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2)
              os.chmod(profile_file, 0o600)

              display_name = f"RDP - {computer}"
              desktop_data = (
                  "[Desktop Entry]\n"
                  "Type=Application\n"
                  "Version=1.0\n"
                  f"Name={display_name}\n"
                  f"Comment=Remote Desktop connection to {computer}:{port}\n"
                  f"Exec=/usr/local/bin/thinclient-rdp-profile {profile_file}\n"
                  "Icon=computer-symbolic\n"
                  "Terminal=false\n"
                  "Categories=Network;\n"
                  "StartupNotify=true\n"
              )
              with open(desktop_file, "w", encoding="utf-8") as f:
                  f.write(desktop_data)
              os.chmod(desktop_file, 0o755)
              subprocess.run(["/usr/bin/gio", "set", "-t", "string", desktop_file, "metadata::trusted", "true"],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              dialog = Gtk.MessageDialog(transient_for=self, modal=True, message_type=Gtk.MessageType.INFO,
                                         buttons=Gtk.ButtonsType.OK, text="Remote Desktop connection created.")
              dialog.format_secondary_text(f"{display_name} has been added to the desktop.")
              dialog.run(); dialog.destroy(); Gtk.main_quit()
      
          def connect_rdp(self, _button):
              valid = self.validate()
              if not valid:
                  return
              computer, port = valid
              data = self.data(computer, port)
              self.save_global(data)
              args = ["/usr/bin/xfreerdp3", f"/v:{computer}", f"/port:{port}", "/cert:tofu", "/from-stdin:force"]
              if data["username"]: args.append(f"/u:{data['username']}")
              if data["domain"]: args.append(f"/d:{data['domain']}")
              if data["network"]: args.append(f"/network:{data['network']}")
              if data["scale"]: args.append(f"/scale:{data['scale']}")
              if data["fullscreen"]: args.append("/f")
              if data["multimon"]: args.append("/multimon")
              if data["dynamic_resolution"]: args.append("+dynamic-resolution")
              elif data["resolution"]: args.append(f"/size:{data['resolution']}")
              if data["clipboard"]: args.append("+clipboard")
              if data["audio"]: args.append("/sound")
              if data["microphone"]: args.append("/microphone")
              try:
                  log = open("/tmp/thinclient-rdp.log", "w", buffering=1)
                  proc = subprocess.Popen(args, stdin=subprocess.PIPE, stdout=log, stderr=subprocess.STDOUT,
                                          text=True, start_new_session=True)
                  proc.stdin.write(self.password.get_text() + "\n")
                  proc.stdin.flush(); proc.stdin.close()
                  self.password.set_text("")
                  Gtk.main_quit()
              except Exception:
                  self.password.set_text("")
                  self.status.set_markup("<span foreground='red'>Unable to start Remote Desktop.</span>")
      
      window = RDPWindow()
      window.show_all()
      window.computer.grab_focus()
      Gtk.main()
