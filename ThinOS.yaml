              page = Gtk.ScrolledWindow()
              page.set_policy(Gtk.PolicyType.NEVER, Gtk.PolicyType.AUTOMATIC)

              content = Gtk.Box(
                  orientation=Gtk.Orientation.VERTICAL,
                  spacing=24
              )

              content.set_margin_start(24)
              content.set_margin_end(24)
              content.set_margin_top(24)
              content.set_margin_bottom(24)

              page.add(content)

              device = make_group(content, "Device")
              add_row(device, "Device name", platform.node(), "computer-symbolic")
              add_row(device, "Operating system", os_name(), "drive-harddisk-symbolic")
              add_row(device, "Kernel", platform.release(), "application-x-firmware-symbolic")

              hardware = make_group(content, "Hardware")
              add_row(hardware, "Processor", cpu_name(), "applications-system-symbolic")
              add_row(hardware, "Memory", memory_total(), "media-flash-symbolic")

              interface, ipv4, gateway, mac = network_information()

              network = make_group(content, "Network")
              add_row(
                  network,
                  "Status",
                  "Connected" if ipv4 else "Disconnected",
                  "network-wired-symbolic"
              )
              add_row(network, "Interface", interface, "network-wired-symbolic")
              add_row(network, "IPv4 address", ipv4, "network-transmit-receive-symbolic")
              add_row(network, "Gateway", gateway, "network-server-symbolic")
              add_row(network, "MAC address", mac, "network-workgroup-symbolic")

              system = make_group(content, "System")
              add_row(system, "Uptime", uptime(), "preferences-system-time-symbolic")

              root.pack_start(page, True, True, 0)
              win.add(root)
              win.show_all()


      app = SystemInformation()
      app.run()
