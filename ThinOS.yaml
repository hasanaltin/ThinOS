              self.position_panel()
              self.panel.show_all()

          def status_button(
              self,
              icon_name,
              callback,
              tooltip
          ):
              button = Gtk.Button()
              button.set_name("StatusButton")
              button.set_relief(
                  Gtk.ReliefStyle.NONE
              )
              button.set_tooltip_text(tooltip)
              button.set_size_request(
                  44,
                  PANEL_HEIGHT
              )

              image = Gtk.Image.new_from_icon_name(
                  icon_name,
                  Gtk.IconSize.LARGE_TOOLBAR
              )
              image.set_pixel_size(23)

              button.add(image)
              button.connect("clicked", callback)

              return button

          def position_panel(self):
              display = Gdk.Display.get_default()
              monitor = (
                  display.get_primary_monitor()
                  if display
                  else None
              )

              if (
                  monitor is None
                  and display is not None
                  and display.get_n_monitors() > 0
              ):
                  monitor = display.get_monitor(0)

              if monitor is not None:
                  geometry = monitor.get_geometry()

                  self.panel_x = geometry.x
                  self.panel_y = geometry.y + geometry.height - PANEL_HEIGHT

                  self.panel.move(
                      self.panel_x,
                      self.panel_y
                  )

                  self.panel.set_size_request(
                      geometry.width,
                      PANEL_HEIGHT
                  )

              else:
                  screen = Gdk.Screen.get_default()

                  self.panel_x = 0
                  self.panel_y = screen.get_height() - PANEL_HEIGHT

                  self.panel.move(
                      self.panel_x,
                      self.panel_y
                  )

                  self.panel.set_size_request(
                      screen.get_width(),
                      PANEL_HEIGHT
                  )

          def setup_tasklist(self):
              Wnck.set_client_type(Wnck.ClientType.PAGER)

              self.wnck_screen = Wnck.Screen.get_default()
              self.wnck_screen.connect("window-opened", self.on_window_opened)
              self.wnck_screen.connect("window-closed", self.on_window_closed)

              self.wnck_screen.connect(
                  "active-window-changed",
                  self.on_active_window_changed
              )

              self.wnck_screen.force_update()

              for window in self.wnck_screen.get_windows():
                  self.add_task_button(window)

          def on_window_opened(self, _screen, window):
              self.add_task_button(window)

          def on_window_closed(self, _screen, window):
              button = self.task_buttons.pop(window, None)
              if button is not None:
                  button.destroy()

          def on_active_window_changed(self, screen, _previous_window):
              active = screen.get_active_window()

              for window, button in self.task_buttons.items():
                  button.set_active(window == active)

          def add_task_button(self, window):
              if window.is_skip_tasklist() or window in self.task_buttons:
                  return

              button = Gtk.ToggleButton()
              button.set_name("TaskButton")
              button.set_relief(Gtk.ReliefStyle.NONE)

              box = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=6
              )

              icon = Gtk.Image()
              pixbuf = window.get_icon()
              if pixbuf is not None:
                  icon.set_from_pixbuf(pixbuf)

              label = Gtk.Label(label=window.get_name())
              label.set_max_width_chars(22)
              label.set_ellipsize(Pango.EllipsizeMode.END)
              label.set_xalign(0)

              box.pack_start(icon, False, False, 0)
              box.pack_start(label, True, True, 0)
              button.add(box)

              button.set_active(window.is_active())

              button.connect(
                  "clicked",
                  self.on_task_clicked,
                  window
              )

              window.connect(
                  "name-changed",
                  lambda w: label.set_text(w.get_name())
              )

              self.tasks.pack_start(button, False, False, 0)
              button.show_all()

              self.task_buttons[window] = button

          def on_task_clicked(self, _button, window):
              timestamp = Gtk.get_current_event_time()

              if window.is_minimized():
                  window.unminimize(timestamp)
                  window.activate(timestamp)
              elif window.is_active():
                  window.minimize()
              else:
                  window.activate(timestamp)

          def create_start_menu(self):
              # A real Gtk.Menu instead of a plain Gtk.Window. Menus have
              # their own well-tested pointer grab that dismisses them on an
              # outside click or Escape - relying on the window manager to
              # send a focus-out-event for a plain window turned out to be
              # unreliable here (it could fire immediately after present(),
              # closing the menu on its own, or never fire at all for a
              # genuine outside click). This also lets Tools and Power use
              # native submenus (set_submenu()) instead of manually popped
              # Gtk.Menu instances anchored to a button, which were being
              # mistaken for "the main menu lost focus" and closing it.
              if self.start_menu is not None:
                  self.start_menu.destroy()

              self.start_menu = Gtk.Menu()
              self.start_menu.set_name("StartMenu")
              self.start_menu.connect("deactivate", self.on_start_menu_deactivate)

              self.add_menu_item(
                  self.start_menu,
                  "Citrix Workspace",
                  "citrix-receiver",
                  "/usr/local/bin/thinclient-citrix"
              )

              self.add_menu_item(
                  self.start_menu,
                  "Remote Desktop",
                  "computer-symbolic",
                  "/usr/local/bin/thinclient-rdp"
              )

              self.add_menu_item(
                  self.start_menu,
                  "Omnissa Horizon",
                  "video-display-symbolic",
                  "/usr/local/bin/thinclient-horizon"
              )

              self.separator(self.start_menu)

              admin_label = (
                  "Switch to User"
                  if admin_enabled()
                  else "Switch to Administrator"
              )

              admin_command = (
                  "/usr/local/bin/thinclient-exit-admin"
                  if admin_enabled()
                  else "/usr/local/bin/thinclient-admin-mode"
              )

              self.add_menu_item(
                  self.start_menu,
                  admin_label,
                  (
                      "system-log-out-symbolic"
                      if admin_enabled()
                      else "changes-prevent-symbolic"
                  ),
                  admin_command
              )

              self.add_menu_item(
                  self.start_menu,
                  "System Information",
                  "dialog-information-symbolic",
                  "/usr/local/bin/thinclient-system-info"
              )

              self.add_menu_item(
                  self.start_menu,
                  "Control Panel",
                  "preferences-system-symbolic",
                  "/usr/local/bin/thinclient-control-panel"
              )

              if admin_enabled():
                  self.add_tools_item(self.start_menu)

              self.add_power_item(self.start_menu)

              self.start_menu.show_all()

          def make_menu_row_box(self, label, icon):
              box = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=12
              )

              image = Gtk.Image.new_from_icon_name(
                  icon,
                  Gtk.IconSize.LARGE_TOOLBAR
              )

              image.set_name("MenuIcon")
              image.set_pixel_size(22)

              text = Gtk.Label(label=label)
              text.set_name("MenuLabel")
              text.set_xalign(0)

              box.pack_start(
                  image,
                  False,
                  False,
                  0
              )

              box.pack_start(
                  text,
                  True,
                  True,
                  0
              )

              return box

          def add_menu_item(
              self,
