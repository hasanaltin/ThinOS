          /home/kiosk/.local/share/nemo/actions/60-rdp-start.nemo_action \
          /home/kiosk/.local/share/nemo/actions/61-rdp-edit.nemo_action \
          /home/kiosk/.local/share/nemo/actions/62-rdp-copy.nemo_action \
          /home/kiosk/.local/share/nemo/actions/63-rdp-rename.nemo_action \
          /home/kiosk/.local/share/nemo/actions/64-rdp-delete.nemo_action \
          /home/kiosk/.config/nemo/actions/actions-tree.json
      
      # Validate the entire appliance before switching away from Ubuntu's
      # recovery display manager. A failure here leaves the normal graphical
      # administrator login available instead of a black screen or tty-only boot.
      REQUIRED=(
          /usr/bin/Xorg
          /usr/sbin/lightdm
          /usr/bin/openbox
          /usr/bin/nemo-desktop
          /usr/local/bin/thinclient-session
          /usr/local/bin/thinclient-panel
          /usr/local/bin/thinclient-shell
          /usr/local/bin/thinclient-admin-mode
          /usr/local/sbin/thinclient-admin-tool
          /usr/local/sbin/thinclient-update
          /usr/local/bin/thinclient-rdp
          /usr/share/xsessions/thinclient-openbox.desktop
          /usr/local/share/thinclient/nemo-overlay/nemo-directory-view-ui.xml
      )
      for item in "${REQUIRED[@]}"; do
          if [ ! -e "$item" ]; then
              echo "Validation failed: missing $item" >&2
              exit 40
          fi
      done
      command -v xfreerdp3 >/dev/null 2>&1 || { echo 'Validation failed: xfreerdp3 missing' >&2; exit 41; }
      command -v nmcli >/dev/null 2>&1 || { echo 'Validation failed: nmcli missing' >&2; exit 43; }
      command -v nm-connection-editor >/dev/null 2>&1 || { echo 'Validation failed: nm-connection-editor missing' >&2; exit 44; }
      python3 -m py_compile \
          /usr/local/bin/thinclient-shell \
          /usr/local/bin/thinclient-admin-mode \
          /usr/local/bin/thinclient-power \
          /usr/local/bin/thinclient-rdp \
          /usr/local/bin/thinclient-rdp-profile \
          /usr/local/bin/thinclient-rdp-shortcut \
          /usr/local/bin/thinclient-system-info \
          /usr/local/bin/thinclient-control-panel \
          /home/kiosk/.local/share/nemo-python/extensions/thinclient_connections.py
      bash -n /usr/local/bin/thinclient-session
      bash -n /usr/local/bin/thinclient-panel
      bash -n /usr/local/bin/thinclient-exit-admin
      bash -n /usr/local/bin/thinclient-admin-terminal
      bash -n /usr/local/sbin/thinclient-admin-tool
      bash -n /usr/local/sbin/thinclient-update
      visudo -cf /etc/sudoers.d/thinclient-admin-auth

      # Horizon is a core client for this appliance. If installation fails,
      # retain the Ubuntu recovery desktop and retry provisioning on next boot.
      if ! /usr/local/sbin/install-horizon-client; then
          echo 'Validation failed: Omnissa Horizon Client could not be installed.' >&2
          exit 42
      fi

      # Permissions after final validation.
      chown -R kiosk:kiosk /home/kiosk
      chmod 700 /home/kiosk/.config/thinclient /home/kiosk/.cache/thinclient || true

      # Atomically make LightDM the production display manager only now.
      systemctl disable gdm3.service 2>/dev/null || true
      ln -sf /lib/systemd/system/lightdm.service /etc/systemd/system/display-manager.service
      printf '%s\n' '/usr/sbin/lightdm' > /etc/X11/default-display-manager
      systemctl enable lightdm.service
      systemctl enable ssh.service || true
      systemctl set-default graphical.target

      # Prevent Ctrl+Alt+Delete reboot from bypassing the controlled power menu.
      systemctl mask ctrl-alt-del.target || true

      rm -f "$FAILED"
      touch "$MARKER"
      sync

      # A clean reboot avoids changing display-manager implementations in the
      # middle of the first boot. The next boot goes straight to kiosk LightDM.
      systemctl --no-block reboot || true
      THINCLIENT_FIRSTBOOT
      chmod 755 /target/usr/local/sbin/thinclient-firstboot

    # Provision before the graphical display manager starts. Failure falls back to Ubuntu recovery GUI.
    - |
      cat > /target/etc/systemd/system/thinclient-firstboot.service <<'EOF'
      [Unit]
      Description=Provision Thin Client Appliance
      Wants=network-online.target
      After=network-online.target
      Before=display-manager.service graphical.target
      ConditionPathExists=!/var/lib/thinclient/configured

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/thinclient-firstboot
      RemainAfterExit=no
      TimeoutStartSec=20min

      [Install]
      WantedBy=multi-user.target
      EOF
      chroot /target systemctl enable thinclient-firstboot.service

    # Keep Ctrl+Alt+Delete from bypassing the controlled power menu.
    - |
      chroot /target systemctl mask ctrl-alt-del.target || true

  shutdown: reboot
