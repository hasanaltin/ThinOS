                  background-color: white;
                  border: 1px solid #aeb5ba;
                  border-radius: 9px;
              }
              """

              provider = Gtk.CssProvider()
              provider.load_from_data(css)

              Gtk.StyleContext.add_provider_for_screen(
                  Gdk.Screen.get_default(),
                  provider,
                  Gtk.STYLE_PROVIDER_PRIORITY_APPLICATION
              )

          def create_panel(self):
              self.panel = Gtk.Window(
                  type=Gtk.WindowType.TOPLEVEL
              )

              self.panel.set_name("VDIPanel")
              self.panel.set_decorated(False)
              self.panel.set_resizable(False)
              self.panel.set_keep_above(True)
              self.panel.set_skip_taskbar_hint(True)
              self.panel.set_skip_pager_hint(True)
              self.panel.set_type_hint(
                  Gdk.WindowTypeHint.DOCK
              )
              self.panel.set_accept_focus(False)

              root = Gtk.Box(
                  orientation=Gtk.Orientation.HORIZONTAL,
                  spacing=0
              )

              self.panel.add(root)

              self.start_button = Gtk.Button()
              self.start_button.set_name("StartButton")
              self.start_button.set_relief(
                  Gtk.ReliefStyle.NONE
              )
              self.start_button.set_size_request(
                  62,
                  PANEL_HEIGHT
              )

              start_icon = Gtk.Image.new_from_icon_name(
                  "view-list-symbolic",
                  Gtk.IconSize.LARGE_TOOLBAR
              )
              start_icon.set_pixel_size(28)

              self.start_button.add(start_icon)

              self.start_button.connect(
                  "clicked",
                  self.toggle_start_menu
              )

              root.pack_start(
                  self.start_button,
