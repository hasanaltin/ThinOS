                  ),
                  (
                      "Shut Down",
                      "/usr/local/bin/thinclient-power poweroff"
                  ),
              ]:
                  item = Gtk.MenuItem(label=label)

                  item.connect(
                      "activate",
                      lambda _item, c=command_line: spawn(c)
