          def refresh_wifi(self, _button):
              for row in self.wifi_rows:
                  self.wifi_group.remove(row)
              self.wifi_rows = []

              row = Adw.ActionRow(title="Scanning…")
              add_icon(row, "network-wireless-symbolic")
              self.wifi_group.add(row)
              self.wifi_rows.append(row)

              threading.Thread(
                  target=self.scan_wifi_thread,
                  daemon=True
              ).start()

          def scan_wifi_thread(self):
              networks = wifi_scan()
              GLib.idle_add(self.populate_wifi, networks)

          def populate_wifi(self, networks):
              for row in self.wifi_rows:
                  self.wifi_group.remove(row)
              self.wifi_rows = []

              if networks is None:
                  row = Adw.ActionRow(title="No Wi-Fi adapter detected")
                  add_icon(row, "network-wireless-offline-symbolic")
                  self.wifi_group.add(row)
                  self.wifi_rows.append(row)
                  return False

              if not networks:
                  row = Adw.ActionRow(title="No Wi-Fi networks found")
                  add_icon(row, "network-wireless-symbolic")
                  self.wifi_group.add(row)
                  self.wifi_rows.append(row)
                  return False

              for net in networks[:15]:
                  if net["in_use"]:
                      subtitle = "Connected"
                  elif net["secured"]:
                      subtitle = f"Secured · Signal {net['signal']}%"
                  else:
                      subtitle = f"Open · Signal {net['signal']}%"

                  row = Adw.ActionRow(title=net["ssid"], subtitle=subtitle)

                  add_icon(
                      row,
                      "network-wireless-symbolic"
                      if not net["secured"]
                      else "network-wireless-encrypted-symbolic"
                  )

                  if not net["in_use"]:
                      row.set_activatable(True)
                      add_arrow(row)

                      row.connect(
                          "activated",
                          self.connect_wifi,
                          net["ssid"],
                          net["secured"]
                      )

                  self.wifi_group.add(row)
                  self.wifi_rows.append(row)

              return False

          def connect_wifi(self, _row, ssid, secured):
              if secured:
                  self.prompt_wifi_password(ssid)
              else:
                  threading.Thread(
                      target=self.run_wifi_connect,
                      args=(ssid, None, None, None, None),
                      daemon=True
                  ).start()

          def prompt_wifi_password(self, ssid):
              dialog = Gtk.Window(transient_for=self.window, modal=True)
              dialog.set_title("Wi-Fi Password")
              dialog.set_default_size(380, -1)
              dialog.set_resizable(False)

              box = Gtk.Box(orientation=Gtk.Orientation.VERTICAL, spacing=14)
              box.set_margin_top(20)
              box.set_margin_bottom(20)
              box.set_margin_start(20)
              box.set_margin_end(20)
              dialog.set_child(box)

              label = Gtk.Label(label=f"Enter the password for “{ssid}”")
              label.set_wrap(True)
              label.set_xalign(0)
              box.append(label)

              entry = Gtk.PasswordEntry()
              entry.set_show_peek_icon(True)
              entry.set_activates_default(True)
              box.append(entry)

              status = Gtk.Label()
              status.add_css_class("error")
              status.set_xalign(0)
              box.append(status)

              buttons = Gtk.Box(orientation=Gtk.Orientation.HORIZONTAL, spacing=10)
              buttons.set_halign(Gtk.Align.END)

              cancel = Gtk.Button(label="Cancel")
              cancel.connect("clicked", lambda *_: dialog.close())

              connect = Gtk.Button(label="Connect")
              connect.add_css_class("suggested-action")

              def do_connect(*_):
                  password = entry.get_text()
                  if not password:
                      status.set_label("Password required.")
                      return

                  connect.set_sensitive(False)
                  entry.set_sensitive(False)
                  status.set_label("Connecting…")

                  threading.Thread(
                      target=self.run_wifi_connect,
                      args=(ssid, password, dialog, status, connect),
                      daemon=True
                  ).start()

              connect.connect("clicked", do_connect)
              entry.connect("activate", do_connect)

              buttons.append(cancel)
              buttons.append(connect)
              box.append(buttons)

              dialog.set_default_widget(connect)
              dialog.present()
              entry.grab_focus()

          def run_wifi_connect(
              self, ssid, password, dialog, status, connect_button
          ):
              args = ["nmcli", "device", "wifi", "connect", ssid]
              if password:
                  args += ["password", password]

              try:
                  result = subprocess.run(
                      args, capture_output=True, text=True, timeout=45
                  )
                  ok = result.returncode == 0
                  error = result.stderr.strip()
              except Exception as exc:
                  ok = False
                  error = str(exc)

              def finish():
                  if dialog is not None:
                      if ok:
                          dialog.close()
                      else:
                          status.set_label(error or "Failed to connect.")
                          connect_button.set_sensitive(True)
                  if ok:
                      self.refresh_wifi(None)
                  return False

              GLib.idle_add(finish)

